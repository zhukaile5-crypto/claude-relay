<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5">
<title>把 Claude 装到手机上</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude">
<style>
:root { --bg: #faf9f5; --surface: #fff; --text: #141413; --text2: #3d3d3a; --muted: #75736c; --line: rgba(31,30,29,.12); --accent: #d97757; --accent-strong: #c15f3c; --soft: rgba(217,119,87,.12); }
@media (prefers-color-scheme: dark) { :root { --bg: #262624; --surface: #30302e; --text: #faf9f5; --text2: #e2dfd6; --muted: #a39f96; --line: rgba(255,255,255,.1); --soft: rgba(217,119,87,.18); } }
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(900px 500px at 50% -10%, rgba(217,119,87,.12), transparent 60%), var(--bg); color: var(--text);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100dvh;
  padding: calc(28px + env(safe-area-inset-top)) 20px calc(36px + env(safe-area-inset-bottom)); }
main { max-width: 440px; margin: 0 auto; }
.hero { text-align: center; margin-bottom: 26px; }
.hero img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 8px 26px -8px rgba(120,70,40,.35), 0 0 0 1px var(--line); }
.hero h1 { font: 400 27px/1.3 Georgia, "Songti SC", "Noto Serif SC", serif; margin: 16px 0 6px; }
.hero p { color: var(--muted); margin: 0; font-size: 15px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 16px; margin-bottom: 14px; }
.card h2 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.card h2 .tag { font-size: 11.5px; font-weight: 600; color: var(--accent-strong); background: var(--soft); padding: 2px 8px; border-radius: 999px; }
.card > p { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
ol { margin: 0; padding-left: 1.35em; font-size: 15px; color: var(--text2); }
ol li { margin: 7px 0; }
b { color: var(--text); }
.big { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: #fff;
  font-weight: 600; font-size: 16.5px; font-family: inherit; text-decoration: none; margin: 4px 0 12px; box-shadow: 0 6px 18px -6px rgba(217,119,87,.6); cursor: pointer; }
.big.dark { background: var(--text); color: var(--bg); box-shadow: none; }
.k { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 7px; background: rgba(127,127,127,.14); vertical-align: middle; font-size: 14px; font-weight: 600; margin: 0 2px; }
.k svg { width: 15px; height: 15px; }
.tip { font-size: 13.5px; color: var(--muted); background: var(--soft); border-radius: 12px; padding: 10px 12px; margin-top: 12px; line-height: 1.6; }
.qr { text-align: center; }
.qr img { width: 210px; height: 210px; padding: 10px; background: #fff; border-radius: 16px; border: 1px solid var(--line); }
.done { text-align: center; padding: 26px 18px; }
details { margin-top: 10px; }
details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.wechat-arrow { position: fixed; top: 6px; right: 14px; font-size: 44px; color: var(--accent); animation: bob 1.2s infinite; }
@keyframes bob { 50% { transform: translate(4px, -6px); } }
.hidden { display: none !important; }
a.link { color: var(--accent-strong); }
</style>
</head>
<body>
<main>
  <div class="hero">
    <img src="/icons/icon-192.png" alt="Claude">
    <h1>把 Claude 装到手机上</h1>
    <p>添加后桌面上会多一个图标，点开是全屏的，<br>用起来和 App 一样</p>
  </div>
  <div id="content"></div>
  <p style="text-align:center;margin-top:22px"><a class="link" href="/">先不装，直接打开网页版 →</a></p>
</main>

<script>
const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(ua);
const inWeChat = /MicroMessenger/i.test(ua), inQQ = /\bQQ\//i.test(ua);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const shareIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="#0a84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M7 10H5.5A1.5 1.5 0 0 0 4 11.5v8A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5H17"/></svg>';
const dots = '<span class="k">⋮</span>', menu = '<span class="k">≡</span>', more = '<span class="k">···</span>';
const C = document.getElementById('content');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

// 安卓各家浏览器「添加到桌面」的位置
function androidBrowser() {
  const list = [
    [/HuaweiBrowser|HuaWei.*Browser|HONORBrowser/i, '华为 / 荣耀浏览器', `点底部的 ${menu} 菜单`, '选 <b>添加至</b> → <b>桌面</b>（有的版本叫「添加到桌面」）'],
    [/MiuiBrowser|XiaoMi\/MiuiBrowser/i, '小米浏览器', `点底部的 ${menu} 菜单`, '选 <b>添加到桌面</b>（可能在「工具箱」里）'],
    [/HeyTapBrowser|OppoBrowser|OnePlus/i, 'OPPO / 一加浏览器', `点底部的 ${menu} 菜单`, '选 <b>添加到</b> → <b>桌面</b>'],
    [/VivoBrowser/i, 'vivo 浏览器', `点底部的 ${menu} 菜单`, '选 <b>添加到桌面</b>'],
    [/SamsungBrowser/i, '三星浏览器', `点右下角的 ${menu} 菜单`, '选 <b>添加页面至</b> → <b>主屏幕</b>'],
    [/Quark/i, '夸克浏览器', `点底部的 ${menu} 菜单`, '选 <b>添加到桌面</b>（可能在「工具」里）'],
    [/UCBrowser/i, 'UC 浏览器', `点底部的 ${menu} 菜单`, '选 <b>添加到桌面</b>'],
    [/EdgA/i, 'Edge 浏览器', `点底部的 ${more} 菜单`, '选 <b>添加到手机</b> 或 <b>安装应用</b>'],
    [/Firefox/i, 'Firefox 浏览器', `点右上角的 ${dots} 菜单`, '选 <b>安装</b> 或 <b>添加到主屏幕</b>'],
    [/Chrome/i, 'Chrome 浏览器', `点右上角的 ${dots} 菜单`, '选 <b>安装应用</b> 或 <b>添加到主屏幕</b>'],
  ];
  const hit = list.find(([re]) => re.test(ua));
  return hit ? { name: hit[1], step1: hit[2], step2: hit[3] } : { name: '你的浏览器', step1: `打开浏览器的菜单（通常是 ${menu} 或 ${dots}）`, step2: '找 <b>添加到桌面</b>、<b>添加到主屏幕</b> 或 <b>安装应用</b>' };
}

function render() {
  if (standalone) {
    C.innerHTML = `<div class="card done"><h2 style="justify-content:center">✅ 已经装好了</h2><p style="color:var(--muted)">你现在就在 App 里</p><a class="big" href="/">打开 Claude</a></div>`;
    return;
  }
  if (inWeChat || inQQ) {
    C.innerHTML = `<div class="wechat-arrow">↗</div><div class="card"><h2>第一步：换到浏览器里打开</h2>
      <p>${inWeChat ? '微信' : 'QQ'}里的浏览器不能添加到桌面，也用不了语音输入。</p>
      <ol><li>点右上角的 ${more}</li><li>选 <b>在浏览器打开</b>${isIOS ? '（会用 Safari 打开）' : ''}</li><li>在浏览器里会再次看到这个页面，按提示安装</li></ol></div>`;
    return;
  }
  if (isIOS) {
    const safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|Quark|UCBrowser|baiduboxapp/i.test(ua);
    C.innerHTML = `
      <div class="card"><h2>方法一：一键安装 <span class="tag">最简单</span></h2>
        <p>下载一个描述文件，在设置里点安装，桌面就会出现 Claude 图标。</p>
        <a class="big" href="/claude.mobileconfig">下载安装文件</a>
        <ol><li>弹出提示时点 <b>允许</b></li><li>打开手机的 <b>设置</b>，最上面会出现 <b>已下载描述文件</b>，点进去</li>
          <li>点右上角 <b>安装</b>，输入锁屏密码，再点 <b>安装</b></li><li>回到桌面，就能看到 Claude 图标了</li></ol>
        <div class="tip">安装时会显示「未签名」，这是正常的：这是自己部署的私人网站，没有向苹果申请证书。这个文件只包含一个桌面图标，随时可以在 设置 → 通用 → VPN与设备管理 里删除。${safari ? '' : '<br><b>如果点了没反应，请用 Safari 打开这个页面再试。</b>'}</div>
      </div>
      <div class="card"><h2>方法二：用 Safari 的分享按钮</h2>
        <ol>${safari ? '' : '<li>先用 <b>Safari</b> 打开 claude-relay.example/install</li>'}
          <li>点屏幕底部的分享按钮 <span class="k">${shareIcon}</span></li>
          <li>往下滑，选 <b>添加到主屏幕</b></li><li>点右上角 <b>添加</b></li></ol>
      </div>`;
    return;
  }
  if (isAndroid) {
    const b = androidBrowser();
    C.innerHTML = `
      <div class="card hidden" id="oneTap"><h2>一键安装 <span class="tag">推荐</span></h2>
        <p>你的浏览器支持直接安装。</p><button class="big" id="installNow">安装 Claude</button></div>
      <div class="card"><h2>在${b.name}里添加</h2>
        <ol><li>${b.step1}</li><li>${b.step2}</li><li>如果弹出确认，点 <b>添加</b> 或 <b>确定</b></li></ol>
        <div class="tip"><b>菜单里没有这一项，或者点了没反应？</b><br>国产手机默认不让浏览器往桌面放图标${/Chrome/.test(b.name) ? '，Chrome 会因此直接把「添加到主屏幕」从菜单里藏起来' : ''}。
          去 <b>设置 → 应用 → ${b.name.replace(/ \/.*/, '')} → 权限</b>，打开 <b>桌面快捷方式</b>（有的叫「创建桌面快捷方式」或「桌面图标」），
          然后<b>彻底关掉浏览器再重新打开</b>（在后台任务里划掉），回到这个页面重新添加。</div>
        <details><summary>菜单里找不到「添加到桌面」？</summary>
          <p style="font-size:14px;color:var(--muted);margin:8px 0 0">可以在应用商店搜索安装 <b>Microsoft Edge</b>，用它打开 claude-relay.example/install，会出现「安装 Claude」按钮，一点就装好。</p></details>
      </div>`;
    return;
  }
  // 电脑上：给二维码
  C.innerHTML = `<div class="card qr"><h2 style="justify-content:center">用手机扫一扫</h2>
    <p>用手机相机或浏览器扫码，打开后按提示添加到桌面</p><img src="/qr.svg" alt="二维码"><p style="margin-top:10px">${location.host}/install</p></div>`;
}
render();

// Chrome / Edge / 三星浏览器等支持的一键安装
let prompt = null;
addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); prompt = e;
  const box = document.getElementById('oneTap'); if (!box) return;
  box.classList.remove('hidden');
  document.getElementById('installNow').onclick = async () => {
    prompt.prompt();
    const r = await prompt.userChoice.catch(() => null);
    if (r && r.outcome === 'accepted') box.innerHTML = '<h2>✅ 正在安装</h2><p>稍等几秒，桌面上就会出现 Claude 图标</p>';
  };
});
addEventListener('appinstalled', () => { C.innerHTML = `<div class="card done"><h2 style="justify-content:center">✅ 装好了</h2><p style="color:var(--muted)">回到桌面，点 Claude 图标打开</p></div>`; });
</script>
</body>
</html>
