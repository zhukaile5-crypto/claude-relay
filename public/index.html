.banner .bswitch { margin-left: 10px; padding: 2px 11px; border-radius: 999px; font-size: 12.5px; color: var(--on-accent); background: var(--accent); vertical-align: 1px; }
.banner .bswitch:hover { background: var(--accent-strong); }
:root[data-provider="google"] .banner .bswitch { background: linear-gradient(135deg, #4f7ff0, #9a6df2); color: #fff; }
.banner .bx { position: absolute; right: 5px; top: 50%; margin-top: -13px; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
.banner .bx:hover { background: var(--hover); color: var(--text); }
.banner .bx svg { width: 14px; height: 14px; }
#heroNotice .banner { margin-bottom: 12px; }
/* 对话页的通知条右下角趴着小螃蟹，关闭按钮放左边，免得被它挡住 */
#banner .banner.closable { padding-right: 12px; padding-left: 38px; }
#banner .banner .bx { right: auto; left: 5px; }
#dropmask { position: fixed; inset: 0; z-index: 90; background: color-mix(in srgb, var(--bg) 82%, transparent); display: grid; place-items: center; pointer-events: none; }
#dropmask div { border: 2px dashed var(--accent); border-radius: 22px; padding: 36px 56px; font-size: 17px; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 14px; }
#dropmask .crab { width: 64px; height: 48px; }
#toast { position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 12px; font-size: 14px; z-index: 120; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: pop .2s var(--ease); }
#lightbox { position: fixed; inset: 0; z-index: 110; background: rgba(0,0,0,.82); display: grid; place-items: center; cursor: zoom-out; padding: 20px; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
#scrim { display: none; }

/* 手机刘海、底部横条等安全区域（像 App 一样全屏打开时） */
.topbar { padding-top: env(safe-area-inset-top); height: calc(54px + env(safe-area-inset-top)); }
.side-top { padding-top: calc(12px + env(safe-area-inset-top)); }
.p-head { padding-top: env(safe-area-inset-top); height: calc(54px + env(safe-area-inset-top)); }
/* 桌面端 0.8.1 起窗口没有系统标题栏，页面顶到窗口最上面，右上角压着最小化 / 最大化 / 关闭三个按钮：最靠右的那一栏给它们让出位置。
   env(titlebar-area-*) 只有那种窗口里才有值，在浏览器、手机和旧桌面端里这两行算出来就是原来的内边距。拖动窗口的那一条由桌面端自己加 */
#app:not(.panel-open) .topbar { padding-right: calc(10px + 100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw)); }
#app.panel-open .p-head { padding-right: calc(8px + 100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw)); }
.brand, #convTitle .crumb { -webkit-app-region: no-drag; } /* 标志悬停时的小动画、项目名的面包屑照常能用 */
/* 这种窗口里右上角不再放「新对话」的加号（挤在三个窗口按钮旁边，机主说不要）：侧边栏开着时左边本来就有「新对话」；
   侧边栏收起时把它挪到左边、挨着「打开侧边栏」。html.wco 由下面的脚本在这种窗口里加上，别处没有这个类，一切照旧 */
html.wco #topNew { display: none; }
html.wco #app.side-collapsed #topNew { display: grid; }
html.wco #app.side-collapsed #convTitle { order: 1; }
html.wco #app.side-collapsed #chatMode { order: 2; } /* 「聊天 / 工作」不管侧边栏开没开，都在标题右边、三个窗口按钮左边，位置不跳 */
html.wco #app.side-collapsed #lfGlobal { order: 2; } /* 传输指示跟着它，一直在它左边 */
@media (max-width: 420px) { .lf-global { padding: 0 6px; } .lf-global span { display: none; } } /* 很窄时只留小圆环，标题少让一点位置 */
.composer-dock { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
.side-foot { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
#login { padding-top: calc(24px + env(safe-area-inset-top)); padding-bottom: calc(24px + env(safe-area-inset-bottom)); }

/* 「添加到主屏幕」说明 */
#installSheet { position: fixed; inset: 0; z-index: 130; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; } }
#installSheet .sheet { width: min(460px, 100%); background: var(--bg); border-radius: 22px 22px 0 0; padding: 22px 22px calc(22px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0,0,0,.2); animation: up .3s var(--ease); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
#installSheet h3 { font: 500 20px var(--serif); margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
#installSheet h3 img { width: 40px; height: 40px; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); }
#installSheet p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
#installSheet ol { margin: 0 0 18px; padding-left: 1.4em; font-size: 15px; line-height: 2; }
#installSheet .share { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--hover); vertical-align: middle; margin: 0 2px; }
#installSheet .share svg { width: 15px; height: 15px; color: #0a84ff; }
#installSheet .btn { width: 100%; padding: 11px; border-radius: 12px; font-size: 15px; }
#installSheet .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
#installSheet p.ask-detail { white-space: pre-line; }

/* 新模型上线的一次性提示：左边说明，右边一幅蜡笔画（黄昏的海）；手机上画在上面、说明在下面 */
#newsSheet { position: fixed; inset: 0; z-index: 131; background: rgba(0,0,0,.36); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadein .4s; }
#newsSheet .news { position: relative; display: grid; grid-template-columns: 1fr 1fr; width: min(780px, 100%); min-height: 460px; max-height: calc(100dvh - 32px);
  background: var(--bg); border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px -12px rgba(0,0,0,.35), 0 0 0 1px var(--line); animation: newsIn .7s var(--ease); }
@keyframes newsIn { from { transform: translateY(18px); opacity: 0; } }
#newsSheet .news-text { display: flex; flex-direction: column; padding: 30px 28px 26px; overflow-y: auto; }
#newsSheet .news-tag { align-self: flex-start; font-size: 12px; font-weight: 600; color: var(--water); background: var(--water-soft); padding: 3px 10px; border-radius: 99px; margin-bottom: 14px; }
#newsSheet h2 { font: 500 28px/1.25 var(--serif); margin: 0 0 12px; letter-spacing: -.01em; }
#newsSheet .news-lead { color: var(--text2); font-size: 14.5px; line-height: 1.7; margin: 0 0 20px; }
#newsSheet ul { list-style: none; margin: 0 0 24px; padding: 0; display: grid; gap: 16px; }
#newsSheet li { display: grid; grid-template-columns: 20px 1fr; gap: 12px; font-size: 14.5px; line-height: 1.6; color: var(--text2); }
#newsSheet li .icon { width: 18px; height: 18px; margin-top: 2px; color: var(--muted); }
#newsSheet .news-btns { margin-top: auto; display: grid; gap: 10px; }
#newsSheet .news-btns .btn { width: 100%; padding: 10px; border-radius: 12px; font-size: 15px; }
#newsSheet .news-art { position: relative; min-height: 220px; }
#newsSheet .news-art canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.6s ease; }
#newsSheet .news-art canvas.on { opacity: 1; }
#newsSheet .news-name { position: absolute; left: 0; right: 0; top: 44%; text-align: center; font: 400 40px var(--serif); letter-spacing: -.01em;
  color: var(--text); opacity: 0; transition: opacity 1.4s ease .9s; text-shadow: 0 0 18px var(--bg); }
#newsSheet .news-art canvas.on + .news-name { opacity: .82; }
#newsSheet .news-x { position: absolute; top: 12px; right: 12px; z-index: 1; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 72%, transparent); color: var(--text2); }
#newsSheet .news-x .icon { width: 16px; height: 16px; }
@media (max-width: 640px) {
  #newsSheet { align-items: flex-end; padding: 0; }
  #newsSheet .news { grid-template-columns: 1fr; min-height: 0; border-radius: 22px 22px 0 0; max-height: 92dvh; }
  #newsSheet .news-art { order: -1; min-height: 0; height: 190px; }
  #newsSheet .news-name { top: 34%; font-size: 32px; }
  #newsSheet .news-text { padding: 20px 22px calc(20px + env(safe-area-inset-bottom)); }
  #newsSheet h2 { font-size: 23px; }
  #newsSheet ul { gap: 12px; margin-bottom: 20px; }
}
@media (prefers-reduced-motion: reduce) { #newsSheet, #newsSheet .news { animation: none; } #newsSheet .news-art canvas, #newsSheet .news-name { transition: none; } }
#installBtn.hidden { display: none; }

@media (max-width: 860px) {
  #sidebar { position: fixed; z-index: 60; top: 0; bottom: 0; left: 0; }
  #app:not(.side-collapsed) #sidebar { box-shadow: 0 0 40px rgba(0,0,0,.2); } /* 收起时不留阴影，否则屏幕左边会有一道暗边 */
  #app.side-collapsed #sidebar { margin-left: -300px; }
  #app:not(.side-collapsed) #scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.3); }
  #openSide { visibility: visible !important; }
  #app.panel-open #panel { position: fixed; inset: 0; width: 100%; z-index: 70; }
  #thread { padding: 10px 16px 36px; }
  .composer-dock { padding-left: 12px; padding-right: 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  #hero { padding: 16px 16px 10vh; }
  #hero h1 { font-size: 30px; margin-bottom: 10px; }
  .verse { font-size: 14.5px; margin-bottom: 28px; letter-spacing: .1em; }
  .verse small { font-size: 12px; margin-left: 10px; }
  .ububble { max-width: 92%; }
  .model-btn small { display: none; }
  .chat-mode button { padding: 0 9px; } /* 窄屏收一点边距，标题少让一点位置；两个字照样完整 */
  .composer .perch { right: 20px; }
  /* 对话里的输入框默认只占一行，多留些地方看回复（首页的保持原样） */
  #dockSlot .composer { padding-top: 12px; border-radius: 20px; }
  #dockSlot .composer textarea { min-height: 28px; }
  .disclaimer { font-size: 11px; margin-top: 6px; }
  #thread { padding-bottom: 64px; }
}
/* 触屏：没有鼠标悬停，「更多」按钮常显；按钮按得到的范围放大一些 */
@media (hover: none) {
  .conv .more { opacity: .55; }
  .msg.user .msg-actions { margin-top: 4px; }
}
@media (pointer: coarse) {
  .topbar .ibtn { width: 40px; height: 40px; border-radius: 11px; }
  .topbar .ibtn .icon { width: 20px; height: 20px; }
  .msg-actions .ibtn { width: 34px; height: 34px; }
  .tool-btn, .send { height: 36px; min-width: 36px; }
  .send { width: 36px; }
  .model-btn { height: 36px; }
  .conv .more { width: 32px; }
  .p-head .ibtn { width: 40px; height: 40px; }
}
/* 屏幕很矮（手机键盘弹出）：首页内容靠上排，问候语收小，输入框和工具按钮都留在键盘上面 */
@media (max-width: 860px) and (max-height: 560px) {
  #hero { justify-content: flex-start; padding-top: 4px; padding-bottom: 8px; overflow-y: auto; }
  #hero h1 { font-size: 24px; margin-bottom: 16px; gap: 10px; }
  #hero h1 svg { width: 28px; height: 28px; }
  .verse { display: none; }
  .chips { margin-top: 12px; flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; width: 100%; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; }
}
</style>

const UNREACHABLE = new Set([502, 503, 504, 520, 521, 522, 523, 524, 530]);

async function api(url, opts = {}) {
  const epoch = authState.epoch;
  let r;
  try { r = await fetch(url, { credentials: 'same-origin', ...opts }); }
  catch (e) { if (e.staleAccount || !accountCurrent(epoch)) throw staleAccount(); throw unreachableError('网络不通，暂时连不上'); }
  checkAccount(epoch);
  if (UNREACHABLE.has(r.status)) throw unreachableError('连不上那台电脑，它可能在睡觉');
  const serverDate = Date.parse(r.headers.get('date') || '');
  if (serverDate) S.skew = serverDate - Date.now();
  if (r.status === 401 && !url.includes('/login') && !url.includes('/resume')) {
    // cookie 丢了（微信等内置浏览器常见）：用本地存的凭证换回 cookie，再重试一次
    if (!opts._resumed && ls.get('relayToken', '')) {
      const ok = await fetch('/api/resume', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: ls.get('relayToken', '') }) }).then((x) => x.ok).catch(() => false);
      checkAccount(epoch);
      if (ok) return api(url, { ...opts, _resumed: true });
      ls.set('relayToken', '');
    }
    showLogin(); throw new Error('请先登录');
  }
  const data = await r.json().catch((e) => { if (e.staleAccount) throw e; return {}; });
  checkAccount(epoch);
  if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { code: data.code, choice: data.choice, status: r.status });

}
const post = (url, body, method = 'POST', options = {}) => api(url, { ...options, method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

const CJK_CHAR = /[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Hangul}\u3000-\u303f\uff00-\uffef]/u;

  });

// 过程块的标题：进行中显示当前在做什么，完成后显示一句总结
function procLabel(group, live) {
  const tools = group.filter((e) => e.k === 'tool');
  const thinks = group.filter((e) => e.k === 'thinking');
  const last = group.filter((e) => e.k !== 'tool_result').pop();
  if (live) {
    if (!last || last.k === 'thinking') return '思考中…';
    const [name] = toolInfo(last.name);
    const s = last.summary ? '：' + last.summary.split('\n')[0].slice(0, 60) : '';
    if (last.building) return `正在${name}${s}${last.chars > 300 ? ' · 已生成 ' + fmtChars(last.chars) : '…'}`;
    return `${name}${s}`;
  }
  const thinkMs = thinks.reduce((a, t) => a + (t.durationMs || 0), 0);
  const parts = [];
  if (thinks.length) parts.push(thinkMs >= 1000 ? `思考了 ${fmtElapsed(thinkMs)}` : '思考了一下');
  if (tools.length) {
    const kinds = [...new Set(tools.map((t) => toolInfo(t.name)[0]))].slice(0, 3).join('、');
    parts.push(tools.length > 1 ? `${kinds}（${tools.length} 步）` : kinds);
  }
  return parts.join(' · ') || '工作过程';
}

function renderProc(group, live, msg) {

  d.open = S.open.has(key) ? S.open.get(key) : live;
  const lead = live ? (typeof mascot === 'function' ? mascot(handoffModel(msg?.model, msg?.provider).provider, 'working') : crab('working')) : icon(group.some((e) => e.k === 'tool') ? 'tool' : 'bulb', 'ic');

  const tl = document.createElement('div'); tl.className = 'timeline';
  const results = {};

  for (const e of group) {

// H6：只展示交接的模型名称和数量，不渲染上下文正文或文件路径。

    const grant = htmlNode(`<div class="lf-grant"><span>${icon('folder')}Claude 想用你电脑上的「${esc(msg.accessRequest)}」</span><button class="btn dark" data-yes>允许</button><button class="btn" data-no>不用了</button></div>`);
    grant.querySelector('[data-yes]').onclick = (e) => lfGrant(msg, idx, e.currentTarget);
    grant.querySelector('[data-no]').onclick = () => { msg.accessGranted = 'declined'; rerenderMsg(idx); };
    tail.push(grant);
  }
  // 每条回答用答的那一家的标志（一个对话里换着用几家时一眼看得出是谁答的）
  const mark = (cls) => typeof sigil === 'function' ? sigil(handoffModel(msg.model, msg.provider).provider || 'anthropic', cls) : spark(cls);
  if (running) tail.push(htmlNode(`<div class="msg-live">${mark('sig working')}</div>`));
  if (!running) {
    const acts = document.createElement('div'); acts.className = 'msg-actions';
    const text = msg.events.filter((e) => e.k === 'text').map((e) => e.text).join('\n\n') || msg.result || '';
    // GPT 按用量计费：显示这一轮用了多少 token（填了价格的还显示花费）
    const secs = (msg.durationMs ? ' · ' + fmtElapsed(msg.durationMs) : '')
      + (msg.usage ? ` · ${fmtTokens((msg.usage.input_tokens || 0) + (msg.usage.output_tokens || 0))} tokens` : '')
      + (msg.provider === 'openai' && msg.cost ? ` · $${msg.cost.toFixed(3)}` : '');
    acts.innerHTML = `${mark('sig')}<button class="ibtn" data-a="copy" title="复制">${icon('copy')}</button>` +
      `<button class="ibtn" data-a="speak" title="朗读">${icon('speaker')}</button><button class="ibtn" data-a="retry" title="重新回答">${icon('retry')}</button>` +
      `<span class="mlabel">${esc(modelLabel(msg.model))}${secs}</span>`;
    acts.querySelector('[data-a=copy]').onclick = (e) => copyText(text, e.currentTarget);
    acts.querySelector('[data-a=speak]').onclick = (e) => speak(text, e.currentTarget);
    const rb = acts.querySelector('[data-a=retry]');
    rb.onclick = () => retry(idx);
    rb.onpointerenter = rb.onpointerdown = () => prewarmRetry(idx); // 鼠标移上去/按下时就把要重来的那一轮准备好
    appendCollaborationActions(acts, msg, idx);
    tail.push(acts);
  }
  return { kids, tail, media };
}

function renderAssistant(msg, idx) {
  const el = document.createElement('div');
  el.className = 'msg assistant'; el.dataset.idx = idx;
  const { kids, tail } = assistantParts(msg, idx);
  const body = document.createElement('div'); body.className = 'a-body';
  body.append(...kids);
  el.append(body, ...tail);
  return el;
}
// 原地更新一条正在显示的回复：没变的节点不动，只换掉变了的
function patchAssistant(el, msg, idx) {
  const { kids, tail, media } = assistantParts(msg, idx);
  const body = el.querySelector(':scope > .a-body');
  kids.forEach((k, j) => { const cur = body.childNodes[j]; if (cur !== k) body.insertBefore(k, cur || null); });
  while (body.childNodes.length > kids.length) body.lastChild.remove();
  // 对话里的互动网页保持不动（重绘会让它重新加载、丢掉用户的操作），其余换新
  const oldMedia = el.querySelector(':scope > .media');
  const keep = oldMedia && media && oldMedia.dataset.key === media.dataset.key;
  for (const c of [...el.children]) if (c !== body && !(keep && c === oldMedia)) c.remove();
  for (const c of tail) if (!(keep && c === media)) el.appendChild(c);
}

// 哪些文件直接在对话里展示：网页（可互动）、图片、视频、音频；其余显示成文件卡片
function splitFiles(files) {
  const inline = [], cards = [];
  const htmlDirs = new Set();
  // 同一个文件夹里有多个网页时只展示 index.html（其余当资源）
  const htmls = files.filter((f) => /\.(html?|svg)$/i.test(f.path) && f.url);
  for (const f of htmls) {
    const dir = f.path.replace(/\/[^/]+$/, '');
    const siblings = htmls.filter((g) => g.path.replace(/\/[^/]+$/, '') === dir && /\.html?$/i.test(g.path));
    const pick = siblings.find((g) => /\/index\.html?$/i.test(g.path)) || siblings[0];
    if ((pick === f || /\.svg$/i.test(f.path)) && inline.length < 3) { inline.push(f); htmlDirs.add(dir); } else cards.push(f);
  }
  for (const f of files) {
    if (htmls.includes(f)) continue;
    const e = extOf(f.path);
    if (/^(png|jpe?g|gif|webp|bmp|mp4|webm|mov|mp3|wav|m4a|ogg)$/.test(e) && inline.length < 6) inline.push(f); else cards.push(f);
  }
  return { inline, cards };
}

function renderInlineFile(f) {
  const e = extOf(f.path), name = baseName(f.path);
  if (f.url) {
    const box = document.createElement('div'); box.className = 'artifact';
    box.innerHTML = `<div class="art-head"><span class="ai">${icon(e === 'svg' ? 'file' : 'code')}</span><span class="an">${esc(name)}<small>${e === 'svg' ? '图形' : '可互动'}</small></span>` +
      `<button class="ibtn" data-a="full" title="全屏">${icon('expand')}</button><a class="ibtn" href="${f.url}" target="_blank" rel="noopener" title="在新窗口打开">${icon('ext')}</a>` +
      `<a class="ibtn" href="${fileUrl(f.path, { dl: 1 })}" title="下载">${icon('down')}</a></div>` +
      // 隔离由服务器的 CSP sandbox 响应头保证（拿不到登录信息、碰不到主页面），这里不再重复加 sandbox 属性：
      // 双重沙箱在部分浏览器里会让内容显示为空白
      `<div class="art-frame"><iframe src="${f.url}" allow="fullscreen; autoplay"></iframe></div>`;
    box.querySelector('[data-a=full]').onclick = () => { const fr = box.querySelector('iframe'); (fr.requestFullscreen || fr.webkitRequestFullscreen || (() => openPreview(f.path))).call(fr); };
    return box;
  }
  const src = fileUrl(f.path);
  if (/^(mp4|webm|mov)$/.test(e)) { const v = document.createElement('video'); v.controls = true; v.preload = 'metadata'; v.src = src; return v; }
  if (/^(mp3|wav|m4a|ogg)$/.test(e)) { const a = document.createElement('audio'); a.controls = true; a.preload = 'none'; a.src = src; return a; }
  const img = document.createElement('img'); img.className = 'pic'; img.src = src; img.alt = name; img.loading = 'lazy';
  img.onclick = () => lightbox(src);
  return img;
}

// 录音后上传到电脑，由本地语音识别转成文字，填进输入框（用户可以改完再发）
const mic = { rec: null, chunks: [], timer: 0, start: 0, cancelled: false };
async function toggleMic() {
  const epoch = authState.epoch, key = S.draftFor;
  const btn = $('#micBtn');
  if (mic.rec) { mic.rec.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia) return toast('这个网址不能用麦克风（需要 https 地址）');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch { return toast('需要允许使用麦克风才能语音输入'); }
  if (!accountCurrent(epoch) || S.draftFor !== key) { stream.getTracks().forEach((t) => t.stop()); return; }
  post('/api/voice-warm').catch(() => {}); // 用户说话时电脑那边先把识别模型加载好
  const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg'].find((t) => window.MediaRecorder?.isTypeSupported?.(t)) || '';
  mic.rec = new MediaRecorder(stream, type ? { mimeType: type } : {});
  mic.chunks = []; mic.cancelled = false; mic.start = Date.now();
  mic.rec.ondataavailable = (e) => { if (e.data.size) mic.chunks.push(e.data); };
  mic.rec.onstop = async () => {
    clearInterval(mic.timer);
    stream.getTracks().forEach((t) => t.stop());
    const blob = new Blob(mic.chunks, { type: mic.rec.mimeType || 'audio/webm' });
    mic.rec = null;
    btn.className = 'tool-btn mic'; btn.innerHTML = icon('mic');
    if (mic.cancelled || !accountCurrent(epoch) || Date.now() - mic.start < 600) return;
    btn.classList.add('busy'); btn.title = '正在识别…';
    try {
      const r = await fetch('/api/stt', { method: 'POST', body: blob, credentials: 'same-origin' });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || '识别失败');
      if (!d.text) throw new Error('没有听清，再说一次吧');
      checkAccount(epoch);
      if (S.draftFor !== key) return toast('已切换对话，请在需要的对话里重新录音');
      const inp = $('#input');
      const pos = inp.selectionStart ?? inp.value.length;
      inp.value = inp.value.slice(0, pos) + d.text + inp.value.slice(inp.selectionEnd ?? pos);
      autoGrow(); updateSendBtn(); inp.focus();
      inp.setSelectionRange(pos + d.text.length, pos + d.text.length); saveDraft();
    } catch (e) { if (accountCurrent(epoch)) toast(e.message); }
    finally { if (accountCurrent(epoch)) { btn.classList.remove('busy'); btn.title = '语音输入'; } }
  };
  mic.rec.start(250);
  btn.className = 'tool-btn mic rec'; btn.title = '点一下结束录音';
  btn.innerHTML = '<span class="dot"></span><span>0:00</span>';
  mic.timer = setInterval(() => {
    const s = Math.floor((Date.now() - mic.start) / 1000);
    btn.lastChild.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    if (s >= 300) mic.rec?.stop(); // 最长 5 分钟
  }, 250);
}
function cancelMic() { if (mic.rec) { mic.cancelled = true; mic.rec.stop(); } }

async function openMemory(editing = false) {

      : text ? '<div class="box" id="memView"></div>' : `<div class="box empty"><div>${crab()}还没有记住什么<br><small>聊天时说一句「记住……」，或者点「编辑」自己写</small></div></div>`}
    <div class="note">这是所有对话共用的总记忆。每个项目另有自己的项目记忆（在项目页里），这里只给每个项目留一行现状。</div>
    <div class="note">换哪个模型都能查阅你之前的 ${m.chats} 个对话。记忆只保存在这台电脑上。</div>

// ---------- 朗读 ----------
let speaking = null; // { audio, btn }
async function speak(text, btn) {
  const epoch = authState.epoch;
  if (speaking) { const same = speaking.btn === btn; stopSpeaking(); if (same) return; }
  btn.classList.add('playing'); btn.innerHTML = icon('stop');
  speaking = { btn, audio: null };
  try {
    const r = await fetch('/api/tts', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || '朗读失败');
    if (speaking?.btn !== btn) return;
    const blob = await r.blob();
    checkAccount(epoch);
    if (speaking?.btn !== btn) return;
    const audio = new Audio(URL.createObjectURL(blob));
    speaking.audio = audio;
    audio.onended = stopSpeaking;
    await audio.play();
  } catch (e) { if (accountCurrent(epoch)) { toast(e.message); stopSpeaking(); } }
}
function stopSpeaking() {
  if (!speaking) return;
  if (speaking.audio) { speaking.audio.pause(); URL.revokeObjectURL(speaking.audio.src); }
  speaking.btn.classList.remove('playing'); speaking.btn.innerHTML = icon('speaker');
  speaking = null;
}

function renderUser(msg, idx) {
  const el = document.createElement('div');
  el.className = 'msg user'; el.dataset.idx = idx;
  if (msg.attachments && msg.attachments.length) {
    const box = document.createElement('div'); box.className = 'u-atts';
    for (const a of msg.attachments) {
      if (isImg(a.path)) { const im = document.createElement('img'); im.src = fileUrl(a.path); im.onclick = () => lightbox(fileUrl(a.path)); box.appendChild(im); }
      else box.insertAdjacentHTML('beforeend', `<div class="att"><div class="ficon">${esc(extOf(a.path).slice(0, 4) || 'file')}</div><div class="meta"><div>${esc(a.name)}</div><small>${esc(typeLabel(a.path))}</small></div></div>`);
    }
    el.appendChild(box);
  }
  const ut = msg.tool && S.tools.find((x) => x.id === msg.tool);
  if (ut) el.insertAdjacentHTML('beforeend', `<div class="utool">${ut.emoji} ${esc(ut.label)}</div>`);
  if (msg.action === 'review') {
    const label = document.createElement('div'); label.className = 'review-tag';
    label.textContent = '请 ' + ({ openai: 'GPT', google: 'Gemini' }[handoffModel(msg.model).provider] || 'Claude') + ' 看看';
    label.title = '独立复核上一条回答和相关文件，会请求模型默认不修改文件'; el.appendChild(label);
  } else if (msg.text) { const b = document.createElement('div'); b.className = 'ububble'; b.textContent = msg.text; el.appendChild(b); }
  const acts = document.createElement('div'); acts.className = 'msg-actions';
  acts.innerHTML = `<button class="ibtn" data-a="edit" title="编辑">${icon('edit')}</button><button class="ibtn" data-a="copy" title="复制">${icon('copy')}</button>`;
  acts.querySelector('[data-a=copy]').onclick = (e) => copyText(msg.text, e.currentTarget);
  acts.querySelector('[data-a=edit]').onclick = () => startEdit(el, msg, idx);
  el.appendChild(acts);
  return el;
}

function startEdit(el, msg, idx) {
  if (S.running.has(S.convId)) return toast('等这条回复完成后再编辑');
  requestPrewarm(idx); // 用户改字的工夫，电脑那边先从这一轮之前的会话把 Claude 启动好
  el.innerHTML = '';
  const box = document.createElement('div'); box.className = 'edit-box';
  box.innerHTML = `<textarea rows="1"></textarea><div class="edit-atts"></div><input type="file" multiple hidden>` +
    `<div class="row"><button class="btn add" data-a="add" title="添加附件">${icon('plus', 'icon', 'width:15px;height:15px')}附件</button><button class="btn" data-a="cancel">取消</button><button class="btn dark" data-a="save">发送</button></div>`;
  const ta = box.querySelector('textarea'); ta.value = msg.text;
  const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  // 附件可以删掉、也可以再加（传进这个对话或项目的文件夹，和输入框里加的一样）
  const atts = (msg.attachments || []).map((a) => ({ ...a }));
  const saveBtn = box.querySelector('[data-a=save]');
  const drawAtts = () => {
    const wrap = box.querySelector('.edit-atts'); wrap.innerHTML = '';
    for (const a of atts) {
      const d = document.createElement('div'); d.className = 'att' + (a.uploading ? ' uploading' : '');
      d.innerHTML = (isImg(a.path || a.name) && a.path ? `<img src="${fileUrl(a.path)}" alt="">` : `<div class="ficon">${esc(extOf(a.name).slice(0, 4) || 'file')}</div>`) +
        `<div class="meta"><div>${esc(a.name)}</div><small>${a.uploading ? `上传中 ${Math.floor((a.progress || 0) * 100)}%` : fmtSize(a.size)}</small></div><button class="x" title="移除">${icon('x', 'icon', 'width:12px;height:12px')}</button>`;
      d.querySelector('.x').onclick = () => { a.cancelled = true; atts.splice(atts.indexOf(a), 1); drawAtts(); };
      wrap.appendChild(d);
    }
    saveBtn.disabled = atts.some((a) => a.uploading);
  };
  const picker = box.querySelector('input[type=file]');
  box.querySelector('[data-a=add]').onclick = () => picker.click();
  picker.onchange = async () => {
    const epoch = authState.epoch;
    const files = [...picker.files]; picker.value = '';
    const where = S.conv.projectId ? { project: S.conv.projectId } : { conv: S.convId };
    for (const f of files) {
      if (!accountCurrent(epoch)) return;
      const a = { name: f.name || 'file', size: f.size, uploading: true, progress: 0 };
      atts.push(a); drawAtts();
      try {
        const d = await sendInChunks(f, where, (p) => { a.progress = p; drawAtts(); });
        Object.assign(a, { path: d.path, name: d.name, size: d.size, uploading: false });
      } catch (e) { if (!accountCurrent(epoch)) return; toast(a.name + '：' + e.message); a.cancelled = true; atts.splice(atts.indexOf(a), 1); }
      if (a.cancelled) continue;
      drawAtts();
    }
  };
  ta.oninput = grow;
  ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); saveBtn.click(); } if (e.key === 'Escape') renderThread(); };
  box.querySelector('[data-a=cancel]').onclick = () => renderThread();
  saveBtn.onclick = () => {
    if (atts.some((a) => a.uploading)) return toast('文件还在上传，稍等一下');
    const t = ta.value.trim(), list = atts.filter((a) => a.path).map(({ path, name, size }) => ({ path, name, size }));
    if (t || list.length) send({ text: t, attachments: list, fromIndex: idx, tool: msg.tool });
  };
  el.appendChild(box); drawAtts(); grow(); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}

function retry(assistantIdx) {
  if (S.running.has(S.convId)) return;
  let u = assistantIdx - 1;
  while (u >= 0 && S.conv.messages[u].role !== 'user') u--;
  if (u < 0) return;
  const m = S.conv.messages[u];
  send({ text: m.text, attachments: m.attachments || [], fromIndex: u, tool: m.tool, replyChoice: replyChoiceFor(assistantIdx) });
}

// 停止或出错之后「继续」：从被打断的那一轮接着（Claude 能看到已经做完的部分），而不是从头重来
function continueReply(assistantIdx) {
  if (S.running.has(S.convId) || !S.conv || assistantIdx !== S.conv.messages.length - 1) return;
  send({ text: '继续', attachments: [], continue: true, replyChoice: replyChoiceFor(assistantIdx) });
}

const renderMsg = (m, i) => (m.role === 'user' ? renderUser(m, i) : renderAssistant(m, i));

function renderThread(stick = true) {
  const main = $('#main'), thread = $('#thread'), chat = $('#chat');
  const empty = !S.conv || !S.conv.messages.length;
  main.classList.toggle('is-empty', empty);
  placeComposer();
  setTopTitle();

function groupName(ts) {
  const d = new Date(ts), now = new Date();
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = (day(now) - day(d)) / 864e5;
  if (diff < 1) return '今天'; if (diff < 2) return '昨天'; if (diff < 7) return '过去 7 天'; if (diff < 30) return '过去 30 天';
  return '更早';
}

{

const pendingUploads = new Map(); // 包含尚未开始上传的整批附件，切换草稿时复用同一对象。
const activeUploads = new Map(); // 正在传的：uploadId -> 附件对象（切换对话再切回来时用同一个，不会重复传）

async function upload(files) {
  if (!files.length || !authState.user) return;
  if (!S.draftFor) syncDraft();
  const epoch = authState.epoch, owner = authState.user, key = S.draftFor;
  const pid = S.conv ? S.conv.projectId : S.projectId;
  const where = pid ? { project: pid } : { conv: S.convId || S.conv?.id || (S.draftId ||= newDraftId()) };
  if (!S.convId) S.draftOwnerId = S.draftId;
  // 在批次开始时固定账号、目录和所有附件对象；切页面只改变显示，不改变上传去向。
  const batch = [...files].map((file) => {
    const a = { clientId: newDraftId(), owner, epoch, draftKey: key, draftId: S.draftOwnerId,
      name: file.name || 'image.png', size: file.size, uploading: true, progress: 0,
      preview: file.type.startsWith('image/') ? URL.createObjectURL(file) : '' };
    pendingUploads.set(a.clientId, a); S.atts.push(a);

  });
  renderAtts(); saveDraft();
  for (const { file, a } of batch) {
    if (!accountCurrent(epoch, owner)) return;
    if (a.cancelled) { pendingUploads.delete(a.clientId); continue; }
    try {
      const r = await post('/api/upload-start', { ...where, name: a.name, size: file.size });
      checkAccount(epoch, owner);
      if (a.cancelled) continue;
      a.uploadId = r.id;
      await blobs.put(r.id, file);
      checkAccount(epoch, owner);
      attChanged(a);
      await runUpload(a, file);
    } catch (e) {
      if (!accountCurrent(epoch, owner)) return;
      toast(a.name + '：' + e.message); a.gone = true; removeAtt(a); attChanged(a); renderAtts();
    } finally {

    }

}

// 把一个附件从头（或从断点）传到底。网络问题就停下等用户回来；上传在服务器上已失效、文件也没存住，才让用户重新选
async function runUpload(a, file) {
  if (a.active || !a.uploadId || a.cancelled) return;
  const epoch = a.epoch ?? authState.epoch, owner = a.owner || authState.user;
  if (!accountCurrent(epoch, owner)) return;
  const id = a.uploadId;
  a.active = true; a.paused = false; renderAtts();
  activeUploads.set(id, a);
  const lost = (msg) => Object.assign(new Error(msg), { lost: true });
  try {
    const blob = file || await blobs.get(id);
    checkAccount(epoch, owner);
    if (a.cancelled) return;
    if (!blob) throw lost('上传中断了，这个文件需要重新选一次');
    const ask = async (url, opts) => {
      checkAccount(epoch, owner);
      let r;
      try { r = await fetch(url, { credentials: 'same-origin', ...opts }); }
      catch (e) { checkAccount(epoch, owner); throw new Error('网络断了'); }
      const d = await r.json().catch((e) => { if (e.staleAccount) throw e; return {}; });
      checkAccount(epoch, owner);
      if (r.status === 404) throw lost(d.error || '这次上传已经失效，请重新选择文件');
      return { r, d };
    };
    let { r, d } = await ask('/api/upload-part?id=' + id);
    if (!r.ok) throw new Error(d.error || '上传失败');
    let received = d.received;
    for (;;) {
      checkAccount(epoch, owner);
      if (a.cancelled) return;
      if (d.done) {
        blobs.del(id);
        Object.assign(a, { path: d.path, name: d.name, size: d.size, uploading: false, uploadId: undefined, doneId: id });
        if (!a.preview && isImg(d.path)) a.preview = fileUrl(d.path);
        return;
      }
      a.progress = a.size ? received / a.size : 1; renderAtts();
      ({ r, d } = await ask('/api/upload-part?id=' + id + '&offset=' + received, { method: 'PUT', body: blob.slice(received, received + CHUNK) }));
      if (r.status === 409) { received = d.received; continue; }
      if (!r.ok) throw lost(d.error || '上传失败');
      received = d.received;
    }
  } catch (e) {
    if (!accountCurrent(epoch, owner)) return;
    if (e.lost) { toast(a.name + '：' + e.message); blobs.del(id); a.gone = true; removeAtt(a); }
    else a.paused = true;

    a.active = false; activeUploads.delete(id);

    if (!a.uploading || a.cancelled) pendingUploads.delete(a.clientId);

}

function attChanged(a) {

async function send(opts) {

    if (nav !== S.nav || (background && (S.view !== 'chat' || S.convId !== id))) return; // 等的时候用户已经点开别的了
    const conv = reconcileConversationChoice(fetched, read); if (!conv) return;
    if (!background) restorePendingChoices({ replay: true, onlyConv: id, retry: true });
    if (S.convId === id && S.conv) { // 正显示着这个对话（刚用本机缓存画出来，或断线重连后刷新）
      if (convSig(S.conv) === convSig(conv)) { S.conv = conv; restoreConversationChoice(conv); } // 没变：不用重画
      else refreshConv(conv);
    } else showConv(conv, keepSidebar);
    if (typeof renderChatMode === 'function') renderChatMode(); // 本机缓存里的老对话可能还没有 mode：以联网拿到的为准

}

async function loadState(convId) {
  const read = convId ? captureConversationChoice(convId) : null;
  const s = await api('/api/state' + (convId ? '?conv=' + convId : ''));
  const changed = s.userId && authState.user && s.userId !== authState.user;
  if (changed) resetAccount(s.userId);
  if (s.userId) { authState.user = s.userId; ls.set('lastUserId', s.userId); }
  if (s.conversation && read) s.conversation = reconcileConversationChoice(s.conversation, read);
  applyState(s);
  if (typeof renderChatMode === 'function') renderChatMode(); // 列表、项目换成了新的（项目可能刚建在文件夹上）：新对话的默认跟着变
  const { sessionToken, wakeToken, conversation, ...keep } = s;
  local.put('state', keep);
  if (changed) { start(); throw staleAccount(); } // 旧账号发起的后续操作不能沿用新账号状态。
  // 页面先安顿好，再看要不要弹新模型提示（只弹一次）。回归测试会单独抽出这个函数来跑，那里没有 showNews
  if (typeof showNews === 'function') { const epoch = authState.epoch; setTimeout(() => { if (accountCurrent(epoch)) showNews(); }, 1200); }

// cached：用的是本机存的旧状态（打开 App 时先画出来），哪些对话正在回复以联网后的为准
function applyState(s, cached = false) {
  const previousChoice = { model: S.model, effort: S.effort };
  const previousCollaboration = JSON.stringify([S.models, S.fallbackModels]);
  S.convs = s.conversations; S.running = new Set(cached ? [] : s.running); S.models = s.models; S.userName = s.userName || '';
  S.usage = s.usage; S.projects = s.projects || []; S.tools = s.tools || []; S.serviceNotice = s.serviceNotice || ''; S.serviceNoticeKind = s.serviceNoticeKind || '';
  S.fallbackModels = s.fallbackModels || { anthropic: null, openai: null };
  const lastReply = S.conv?.messages?.length - 1;
  if (previousCollaboration !== JSON.stringify([S.models, S.fallbackModels])) {
    (S.conv?.messages || []).forEach((msg, idx) => { if (msg.role === 'assistant' && msg.status !== 'running') rerenderMsg(idx); });
  } else if (lastReply >= 0 && ['stopped', 'error'].includes(S.conv.messages[lastReply].status)) rerenderMsg(lastReply);
  // 一直开着的页面（手机 App 退到后台不会退出）也要知道有新版本：每次联网取状态都比对一下
  if (!cached && s.pageBuild && /^[a-f0-9]{16}$/.test(PAGE_BUILD) && s.pageBuild !== PAGE_BUILD) { pageLatest = s.pageBuild; showUpdatePill(); }
  if (s.sessionToken) ls.set('relayToken', s.sessionToken); // cookie 丢了时用它恢复登录（/api/resume）
  // 「Claude 在睡觉」页面用它来叫醒电脑（存在 Service Worker 不会清理的缓存里）
  if (s.wakeToken) {
    ls.set('relayWakeToken', s.wakeToken); // Cloudflare 返回的睡觉页面从这里读
    if ('caches' in window) { const epoch = authState.epoch; caches.open('wake').then((c) => { if (accountCurrent(epoch)) return c.put('/__wake_token', new Response(s.wakeToken)); }).catch(() => {}); }
  }
  renderUsage();
  if (!cached) refreshUsage(); // 太旧的话服务器会在后台刷新，新数据通过实时推送回来
  // 默认值只影响新对话；已经打开的其他对话不能被账号推送换模型。
  S.serverDefaultChoice = normalizedChoice({ model: s.defaultModel, effort: s.defaultEffort }, null);
  restorePendingChoices({ replay: !cached });
  applyChoice(s.choice || S.serverDefaultChoice, false);
  ls.set('defaultsVersion', String(s.defaultsVersion));
  if (S.conv) restoreConversationChoice(S.conv, { redraw: false });
  else if (previousChoice.model && !S.models.some((m) => m.id === previousChoice.model)) selectedChoice(previousChoice, { notify: true, redraw: false });
  updateModelBtn(); redrawModelMenu(); renderSidebar(); updateSendBtn(); renderBanner(); updatePerch();
  $('#whoName').textContent = S.userName || '我';
  { const n = [...(S.userName || '我').trim()]; $('#avatar').textContent = (/[㐀-鿿]/.test(n[n.length - 1]) ? n[n.length - 1] : n[0] || '我').toUpperCase(); }
}

const USAGE_NAMES = { session: ['当前时段', '每 5 小时一个周期'], week: ['本周', '所有模型合计'] };
const usageWindows = () => Object.entries((S.usage && S.usage.windows) || {})
  .filter(([, w]) => typeof w.pct === 'number')
  // 已过重置时间的旧数字不算数：窗口已经重新开始，不能再显示上一轮的百分比
  .map(([k, w]) => [k, w.resetsAt && w.resetsAt <= Date.now() ? { ...w, pct: 0, resetsAt: null, expired: true } : w])
  .sort(([a], [b]) => (a === 'session' ? -1 : b === 'session' ? 1 : a === 'week' ? -1 : b === 'week' ? 1 : 0));
const usageName = (key, w) => (USAGE_NAMES[key] || [`本周 · ${w.label || key.replace(/^week_/, '')}`, '单独计算的周额度'])[0];
const barClass = (pct) => (pct >= 90 ? 'u-bar high' : pct >= 70 ? 'u-bar warn' : 'u-bar');

// 重置时间：用用户自己设备的时区显示，比如「今天 18:19」「明天 3:00」「10月29日 周四 15:59」
function fmtReset(ms) {
  if (!ms) return '';
  const d = new Date(ms), now = new Date();
  const hm = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  const days = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  const when = days === 0 ? `今天 ${hm}` : days === 1 ? `明天 ${hm}` : `${d.getMonth() + 1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]} ${hm}`;
  const left = ms - Date.now();
  const rel = left <= 0 ? '' : left < 3600e3 ? `（${Math.max(1, Math.round(left / 60e3))} 分钟后）` : left < 48 * 3600e3 ? `（${Math.round(left / 3600e3)} 小时后）` : '';
  return when + rel;
}
const fmtAgo = (ms) => { const s = Math.round((Date.now() - ms) / 1000); return s < 60 ? '刚刚' : s < 3600 ? `${Math.round(s / 60)} 分钟前` : `${Math.round(s / 3600)} 小时前`; };

function renderUsage() {
  const box = $('#usageBox'), list = usageWindows();
  box.classList.toggle('hidden', !list.length);

    const top = Math.max(...list.map(([, w]) => w.pct));
    box.innerHTML = `<div class="u-head"><b>Claude 额度</b><span>${top >= 100 ? '已用完' : top >= 90 ? '快用完了' : '点击查看详情'}</span></div>` +
      list.slice(0, 2).map(([k, w]) => `<div class="u-row"><span>${k === 'session' ? '5 小时' : '本周'}</span><div class="${barClass(w.pct)}"><i style="width:${Math.min(100, w.pct)}%"></i></div><span>${w.pct}%</span></div>`).join('');
  }
  renderBanner();
  if ($('#usageCard')) fillUsageCard();
}

function renderBanner() {
  // 某个额度快用完时，在输入框上方提醒（用最紧张的那个）
  const b = $('#banner');
  // 输入框上方的提示条在对话页，首页看不到；服务通知首页也要显示
  // 服务端给了类别就按类别（受限 blocked 必须一直显示）；旧服务没有类别时退回按文字判断（两个账号的停用说法不同）
  const closable = !!S.serviceNotice && (S.serviceNoticeKind ? S.serviceNoticeKind !== 'blocked' : !/^.{0,12}暂时(无法|停用)/.test(S.serviceNotice));
  const dismissed = closable && ls.get('noticeOff') === S.serviceNotice;
  const noticeHtml = `<div class="banner${closable ? ' closable' : ''}">${esc(S.serviceNotice)}${closable ? `<button class="bx" title="知道了，不再显示" aria-label="关闭通知">${icon('x')}</button>` : ''}</div>`;
  const closeNotice = (box) => { const x = box.querySelector('.bx'); if (x) x.onclick = () => { ls.set('noticeOff', S.serviceNotice); renderBanner(); }; };
  $('#heroNotice').innerHTML = S.serviceNotice ? (dismissed ? '' : noticeHtml) : ''; closeNotice($('#heroNotice'));
  // 服务器验收没通过：模型暂时停用，告诉用户怎么回事（比额度提醒优先）
  if (S.serviceNotice && !dismissed) { b.innerHTML = noticeHtml; closeNotice(b); return; }
  const worst =usageWindows().sort((x, y) => y[1].pct - x[1].pct)[0];
  // 这些额度是 Claude 订阅的：当前选的是 GPT 或 Gemini 时不提醒。Claude 额度用完时，提醒里直接给一个「改用 …」的按钮
  // （先 Gemini，其次 GPT，见 relayChoiceFor），点了只换输入框里的模型，下一条消息由它接手
  const onClaude = typeof providerOfModel !== 'function' || providerOfModel(S.model) === 'anthropic';
  if (worst && worst[1].pct >= 85 && onClaude) {
    const [k, w] = worst;
    const alt = w.pct >= 100 && typeof relayChoiceFor === 'function' && typeof handoffModel === 'function' ? relayChoiceFor({ model: S.model, effort: S.effort }) : null;
    const altName = alt ? ({ openai: 'GPT', google: 'Gemini' }[handoffModel(alt.model).provider] || 'Claude') : '';
    b.innerHTML = `<div class="banner${alt ? ' has-switch' : ''}">${usageName(k, w)}额度${w.pct >= 100 ? '已用完' : `已用 ${w.pct}%`}${w.resetsAt ? `，${fmtReset(w.resetsAt)}恢复` : ''}${alt ? `<button class="bswitch" title="${esc(modelLabel(alt.model))}">改用 ${altName}</button>` : ''}</div>`;
    const sw = alt && b.querySelector('.bswitch');
    if (sw) sw.onclick = () => { selectedChoice(alt); choiceChanged(); renderBanner(); };
  } else b.innerHTML = '';
}

// 这台设备第一次打开的那天，Claude 固定说这两句：白天是列表里的第一句（和背景画里的荷花、蜻蜓对得上），夜里「海上生明月」
const FIRST_DAY_VERSE = POEMS[0], FIRST_NIGHT_VERSE = POEMS.find((p) => p[0].startsWith('海上生明月'));
const verseSlot = (d) => { const h = d.getHours(); return h >= 5 && h < 11 ? '早' : h >= 11 && h < 16 ? '午' : h >= 16 && h < 19 ? '暮' : '夜'; };
const verseSeason = (d) => { const k = (d.getMonth() + 1) * 100 + d.getDate(); return k >= 204 && k < 506 ? '春' : k >= 506 && k < 808 ? '夏' : k >= 808 && k < 1108 ? '秋' : '冬'; };
// 这一家、这个时节、这个时辰合适的句子。写明了时节的排在前面（seasonal 是它们的个数）：每天默认从应季的里面挑，
// 点一下往后翻，才轮到四季皆宜的
function versesFor(provider, d) {
  const slot = verseSlot(d), season = verseSeason(d), flavor = { openai: '墨', google: '星' }[provider] || '';
  const fits = POEMS.filter((p) => (!p[2] || p[2].includes(season)) && (!p[3] || p[3].includes(slot)));
  let list = flavor ? fits.filter((p) => p[4] === flavor) : fits.filter((p) => p[4] !== '星' || slot === '暮' || slot === '夜');
  // 这一味的不够，添上山水草木的；够了但没有应季的，只添应季的那几句
  if (flavor && list.length < 5) list = list.concat(fits.filter((p) => !p[4]));
  else if (flavor && list.filter((p) => p[2]).length < 2) list = list.concat(fits.filter((p) => !p[4] && p[2]));
  if (!list.length) list = POEMS.filter((p) => !p[2] && !p[3]);
  const seasonal = list.filter((p) => p[2]);
  return { list: [...seasonal, ...list.filter((p) => !p[2])], seasonal: seasonal.length, slot, season };
}
let verseShift = 0, verseShownSlot = '';
function verse() {
  const d = new Date(), provider = document.documentElement.dataset.provider || 'anthropic';
  const { list, seasonal, slot } = versesFor(provider, d);
  if (slot !== verseShownSlot) { verseShownSlot = slot; verseShift = 0; } // 换了时辰：从这个时辰应景的那一句重新开始
  const day = Math.floor((d.getTime() - d.getTimezoneOffset() * 60e3) / 864e5); // 按设备的本地日期
  let first = day; try { first = Number(localStorage.verseDay) || (localStorage.verseDay = day); } catch {}
  const opening = !verseShift && day === first && provider === 'anthropic' ? (slot === '夜' ? FIRST_NIGHT_VERSE : FIRST_DAY_VERSE) : null;
  const [line, src] = opening || list[(((day + '早午暮夜'.indexOf(slot)) % (seasonal || list.length)) + verseShift) % list.length]; // 同一天里早午暮夜各不相同
  $('#verse').innerHTML = `<span>${esc(line)}</span><small>${esc(src)}</small>`;
}
$('#verse').onclick = () => { verseShift++; verse(); };

// 分块把一个文件传到底（不存进 IndexedDB，页面关掉就不续了）。网络断了等两秒问一下服务器收到哪了再接着发，最多试 5 次
async function sendInChunks(file, where, onProgress) {
  const epoch = authState.epoch;
  const { id } = await post('/api/upload-start', { ...where, name: file.name || 'file', size: file.size });
  let received = 0, fails = 0;
  for (;;) {
    checkAccount(epoch);
    let r, d;
    try {
      r = await fetch(`/api/upload-part?id=${id}&offset=${received}`, { method: 'PUT', body: file.slice(received, received + CHUNK), credentials: 'same-origin' });
      d = await r.json().catch(() => ({}));
    } catch {
      checkAccount(epoch);
      if (++fails > 5) throw new Error('网络断了，没传完');
      await new Promise((ok) => setTimeout(ok, 2000));
      checkAccount(epoch);
      try { received = (await api('/api/upload-part?id=' + id)).received; } catch {}
      continue;
    }
    if (r.status === 409) { received = d.received; continue; }
    if (!r.ok) throw new Error(d.error || '上传失败');
    received = d.received; fails = 0;
    if (onProgress) onProgress(file.size ? received / file.size : 1);
    if (d.done) return d;
  }
}

  const pid = S.projectId;
  if (!pid || !files.length) return;
  toast(`正在添加 ${files.length} 份资料…`);
  let ok = 0;
  for (const f of files) {
    if (!accountCurrent(epoch)) return;
    try {
      // 和对话附件一样分块传：Cloudflare 单个请求最多 100MB，整个文件一次发，大文件根本传不上去
      await sendInChunks(f, { project: pid, to: 'files' }, (p) => { if (f.size > 4 * CHUNK) toast(`${f.name}：已上传 ${Math.floor(p * 100)}%`); });
      ok++;
    } catch (e) { if (!accountCurrent(epoch)) return; toast((f.name || '文件') + '：' + e.message); }
  }
  if (ok) toast(`已添加 ${ok} 份资料`);
  refreshProject();
}

const loadedScripts = {};
function loadScript(src) {
  if (src.startsWith('/vendor/')) src += (src.includes('?') ? '&' : '?') + 'build=' + encodeURIComponent(PAGE_BUILD);
  return (loadedScripts[src] = loadedScripts[src] || new Promise((resolve, reject) => {
    const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
  }));
}

function csvTable(text, sep) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length && rows.length < 1000; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true; else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell.replace(/\r$/, '')); rows.push(row); row = []; cell = ''; } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const t = document.createElement('table'); t.className = 'csv';
  t.innerHTML = rows.map((r) => '<tr>' + r.map((c) => `<td>${esc(c)}</td>`).join('') + '</tr>').join('');
  return t;
}

// ---------- 实时事件 ----------
let es, reloadTimer, esRetry = 0, esRetryTimer = 0, esRenewTimer = 0, esLastSeen = 0;
function softReload() { clearTimeout(reloadTimer); reloadTimer = setTimeout(() => { if (S.convId) openConv(S.convId, true, true); }, 300); }
const appShown = () => !$('#app').classList.contains('hidden');
// fresh：刚取过最新的状态和对话（打开 App 时）。连上时什么都没在回复、和刚取到的一致，就不用再取一遍；
// 之后断线重连（回到前台、网络恢复、EventSource 自己重连）仍然重新取，补上断开期间错过的内容
function connectEvents(fresh = false) {
  const epoch = authState.epoch;
  if (es) es.close();
  clearTimeout(esRetryTimer); clearTimeout(esRenewTimer);
  const eventUrl = withAuth('/api/events');
  es = new EventSource(eventUrl);
  const expires = scopedLinks.expiry(eventUrl);
  if (expires) esRenewTimer = setTimeout(() => { if (appShown()) connectEvents(); }, Math.max(1000, expires - Date.now() - S.skew - 30e3));
  esLastSeen = Date.now();
  let first = fresh;
  // 隧道抖一下时 Cloudflare 会回 530/502：浏览器收到这种回复就彻底放弃这条推送、不再自己重连，
  // 电脑上窗口一直开着又等不到「回到前台」，回复就停在半截。所以断了由这里重连，间隔 1、2、4… 最长 30 秒
  es.onerror = () => {
    if (!accountCurrent(epoch)) return;
    if (es.readyState !== EventSource.CLOSED || !appShown()) return; // CONNECTING：浏览器自己在重连
    esRetryTimer = setTimeout(() => { if (appShown()) connectEvents(); }, Math.min(30e3, 1000 * 2 ** esRetry++));
  };
  es.addEventListener('ping', () => { if (accountCurrent(epoch)) esLastSeen = Date.now(); });
  es.onopen = () => { if (accountCurrent(epoch)) esLastSeen = Date.now(); };
  es.onmessage = (e) => {
    if (!accountCurrent(epoch)) return;
    esLastSeen = Date.now(); esRetry = 0;
    const ev = JSON.parse(e.data);
    if (ev.type === 'hello') {
      const same = ev.running.length === S.running.size && ev.running.every((id) => S.running.has(id));
      S.running = new Set(ev.running);
      if (first && same && !ev.running.length) { first = false; return; }
      first = false;
      if (S.convId) softReload(); loadState().catch(() => {}); return;
    }
    if (ev.type === 'job') { ev.running ? S.running.add(ev.convId) : S.running.delete(ev.convId); if (!ev.running && typeof lfAfterReply === 'function') lfAfterReply(ev.convId); renderSidebar(); updateSendBtn(); updatePerch(); if (!ev.running) { loadState().catch(() => {}); if (S.view === 'project') refreshProject(); } return; }
    if (ev.type === 'usage') { S.usage = ev.usage; renderUsage(); return; }
    if (ev.type === 'choice') { applyChoice(ev.choice); return; }
    if ((ev.type === 'done' || ev.type === 'files') && typeof lfAfterReply === 'function') lfAfterReply(ev.convId); // 关联文件夹：看看副本有没有被改
    if (ev.type === 'conversation-choice') { applyConversationChoice(ev.convId, ev.choice); return; }
    if (ev.type === 'list') { if (!drag.active) loadState().catch(() => {}); return; } // 排序、收藏变了（可能是别的设备上拖的）
    if (ev.type === 'title') {
      const c = S.convs.find((x) => x.id === ev.convId); if (c) c.title = ev.title;
      if (S.conv && S.conv.id === ev.convId) { S.conv.title = ev.title; setTopTitle(); }
      renderSidebar(); if (S.view === 'project') refreshProject(); return;
    }
    if (!S.conv || S.conv.id !== ev.convId) {
      if (ev.type === 'done') notifyDone(ev.convId, ev.message);
      return;
    }
    const msg = S.conv.messages[ev.msgIndex];
    if (!msg || msg.role !== 'assistant') return softReload();
    if (ev.type === 'event') {
      if (msg.events.length < 3000) msg.events.push(ev.event);
      rerenderMsg(ev.msgIndex);
    } else if (ev.type === 'delta') {
      const target = msg.events[ev.eventIndex];
      if (!target || (target.k !== 'text' && target.k !== 'thinking')) return softReload();
      target.text = (target.text || '') + ev.text; rerenderMsg(ev.msgIndex);
    } else if (ev.type === 'toolprogress') {
      const target = msg.events[ev.eventIndex];
      if (!target || target.k !== 'tool') return softReload();
      target.chars = ev.chars; if (ev.summary) target.summary = ev.summary;
      rerenderMsg(ev.msgIndex);
    } else if (ev.type === 'evupdate') {
      if (!msg.events[ev.eventIndex]) return softReload();
      msg.events[ev.eventIndex] = ev.event; rerenderMsg(ev.msgIndex);
    } else if (ev.type === 'plan') {
      msg.plan = ev.plan; rerenderMsg(ev.msgIndex);
    } else if (ev.type === 'done') {
      S.conv.messages[ev.msgIndex] = ev.message; S.running.delete(ev.convId);
      rerenderMsg(ev.msgIndex); notifyDone(ev.convId, ev.message);
      setTimeout(() => hop($('#perch .crab')), 50);
      // 回复完多半还会接着问（停止、出错后多半会重发），提前准备好下一轮
      setTimeout(() => { lastWarm.key = ''; if (S.conv?.id === ev.convId) requestPrewarm(); }, 300);
      cacheConv(S.conv);
    } else if (ev.type === 'files') {
      // 这一轮新建/改动的文件：服务器等 Claude 进程退出后才统计好，比「回复完成」晚一点到
      if (ev.turnId ? msg.turnId !== ev.turnId : msg.startedAt !== ev.startedAt) return softReload();
      msg.files = ev.files; rerenderMsg(ev.msgIndex); cacheConv(S.conv);
      if (S.panel?.kind === 'files') openFiles();
    } else if (ev.type === 'memory') {
      // 这一轮更新了哪份记忆：和「改动的文件」一样，比「回复完成」晚一点到
      if (ev.turnId && msg.turnId !== ev.turnId) return softReload();
      msg.memoryUpdated = ev.memory; if (ev.delta) msg.memoryDelta = ev.delta; rerenderMsg(ev.msgIndex); cacheConv(S.conv);
      if (S.panel?.kind === 'memory' && ev.memory.includes('account')) openMemory();
    }
  };
}

// 服务器每 20 秒发一次心跳。连接悄悄断了（没报错、也收不到东西）时，超过 50 秒没动静就重连
setInterval(() => { if (es && appShown() && !document.hidden && Date.now() - esLastSeen > 50e3) connectEvents(); }, 10e3);

function notifyDone(convId, msg) {
  if (!document.hidden) return;
  const c = S.convs.find((x) => x.id === convId);
  const text = (msg.events || []).filter((e) => e.k === 'text').map((e) => e.text).join(' ').replace(/[#*`>\-]/g, '').slice(0, 80) || ((typeof PROVIDER_LABEL === 'object' && PROVIDER_LABEL[providerOfModel(msg.model)]) || 'Claude') + ' 回复好了';

      n.onclick = () => { window.relayDesktop?.show(); window.focus(); if (convId !== S.conv?.id) openConv(convId); };
    }

  let n = 0; clearInterval(notifyDone.t);
  notifyDone.t = setInterval(() => { document.title = n++ % 2 ? '💬 回复好了' : (S.conv ? S.conv.title : 'Claude'); if (!document.hidden) { clearInterval(notifyDone.t); document.title = S.conv ? S.conv.title + ' - Claude' : 'Claude'; } }, 1000);
}

// 浏览器里存过账号密码（Chrome 等）：弹出已保存账号的选择框，点哪个就用哪个登录；关掉选择框就照常手动输入
let credAsked = false;
async function pickSavedAccount() {
  if (credAsked || !window.PasswordCredential || !navigator.credentials) return;
  credAsked = true;

async function start() {
  const epoch = authState.epoch;
  const last = ls.get('lastConv', '');
  // 先用这台设备上存的列表和上次的对话把界面画出来，不用等网络
  let shown = false;
  const cs = await local.get('state');
  if (!accountCurrent(epoch)) return;
  if (cs) {
    applyState(cs, true); showApp(); shown = true;
    const hasLast = last && cs.conversations.some((x) => x.id === last);
    const c = hasLast && await cachedConv(last);
    if (!accountCurrent(epoch)) return;
    if (c) showConv(c, true);
    // 输入框一开始就放好，不等联网：以前新对话页先只有问候语和工具按钮，联网回来输入框才突然插进去，把问候语往上顶
    else if (hasLast) { $('#main').classList.remove('is-empty'); placeComposer(); } // 上次的对话本机没存：先按对话页的样子，内容等联网
    else { renderThread(); syncDraft(); }
  }
  const nav = S.nav;
  // 再联网：一个请求同时拿回最新的状态和上次的对话
  let s;
  try { s = await loadState(last || undefined); }
  catch (e) {
    if (e.unreachable && !liveParam) location.replace('/?live=' + Date.now());
    return;
  }
  if (!accountCurrent(epoch)) return;
  if (!shown) showApp();
  if (S.nav === nav) { // 等网络的时候用户没有自己点开别的对话
    const c = s.conversation;
    if (c && S.convId === c.id && convSig(S.conv) === convSig(c)) { S.conv = c; restoreConversationChoice(c); } // 和本机存的一样：不用重画
    else if (c && S.convId === c.id) refreshConv(c); // 本机存的是旧版本：只重画变了的消息
    else if (c) showConv(c, true);
    else newChat();
    if (c) cacheConv(c);
  }
  syncDraft(); // 没有可显示的对话时（比如在新对话页）也取出草稿
  pruneDrafts();
  connectEvents(true);
  requestAnimationFrame(() => $('#app').classList.add('ready'));
  try { if ('Notification' in window && Notification.permission === 'default') document.addEventListener('click', () => Notification.requestPermission(), { once: true }); } catch {}
}

// ---------- 聊天 / 工作 ----------
// 对话分两种：聊天只聊天，碰不到用户电脑上的文件；工作可以读、改用户电脑上的文件夹（就是下面「关联文件夹」那一套）。
// 顶栏右边的切换：新对话发出第一条消息之前可以换，发出去就定下来了（服务器只认新建时带的 mode，之后的一律不理，见 server.js 的 conversationMode）。
// 新对话默认用用户上次选的；在建在文件夹上的项目里默认工作（这一次不记）。没有桌面端的地方（浏览器、手机）新对话只能聊天，
// 建在文件夹上的项目除外：用的是已经传到服务器上的那份副本
const CHAT_MODE_TIPS = { chat: '只聊天，不碰你电脑上的文件', work: '可以读和改你电脑上的文件夹' };
const isChatMode = (m) => m === 'chat' || m === 'work';
// 一个对话是哪种：服务器给的 mode；本机缓存里的老对话没有，就看列表里的；再没有就照服务器的规则推断（关联过文件夹、或在建在文件夹上的项目里 → 工作）
function convModeOf(conv, id = conv?.id) {
  if (isChatMode(conv?.mode)) return conv.mode;
  const meta = id ? (S.convs || []).find((c) => c.id === id) : null;
  if (isChatMode(meta?.mode)) return meta.mode;
  const pid = conv?.projectId || meta?.projectId, proj = pid && (S.projects || []).find((p) => p.id === pid);
  return (conv?.messages || []).some((m) => m.role === 'user' && lfInfos(m.linked).length) || (proj && lfInfos(proj.linked).length) ? 'work' : 'chat';
}
// 某个对话是哪种（回复结束时用，那个对话不一定开着）
const chatModeOfConv = (convId) => convModeOf(S.conv?.id === convId ? S.conv : null, convId);
// 这个输入框还是不是没开始的新对话（项目页的输入框也算）。发出第一条的那一刻 S.conv 就有了编号，从那时起就锁住
const chatModeOpen = () => !S.convId && !S.conv?.id;
// 新对话里能不能选工作：有桌面端，或者在建在文件夹上的项目里
function chatModeCanWork() { const proj = lfProject(); return !!LF.api || (!!proj && lfInfos(proj.linked).length > 0); }
// 这个输入框现在是哪种
function chatModeNow() {
  if (!chatModeOpen()) return convModeOf(S.conv, S.convId || S.conv?.id);
  // 这台电脑上刚给这个项目授权、第一次整传还没传完的文件夹也算（它要传完才记到项目信息上，见 lfListInProject）
  const proj = lfProject(), folders = !!proj && (lfInfos(proj.linked).length > 0 || (LF.links || []).some((l) => l.scope === 'p:' + proj.id));
  const pick = S.draftMode && S.draftMode.key === draftKey() ? S.draftMode.mode : folders ? 'work' : ls.get('chatMode', 'chat');
  return pick === 'work' && chatModeCanWork() ? 'work' : 'chat';
}

function renderChatMode() {
  const box = $('#chatMode'); if (!box) return;
  const show = S.view === 'chat' || S.view === 'project', open = chatModeOpen(), mode = chatModeNow(), canWork = chatModeCanWork();
  const sig = [show, open, mode, canWork].join('|');
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  box.classList.toggle('hidden', !show);
  box.classList.toggle('locked', !open);

    const m = b.dataset.m, off = !open || (m === 'work' && !canWork);
    b.classList.toggle('on', m === mode);

  }
}

// 切到聊天不收回已经授权的文件夹：切回来还在；真用聊天发出去时才收回（见 lfBeforeSend）
function setChatMode(m) {

}

// ---------- 关联文件夹（只有桌面端有）----------
// 用户在桌面端选一个自己电脑上的文件夹，这里把里面的文件传到服务器的 linked/<编号>/（一份副本），模型读、改的是副本。
// 回复结束后比对三方——用户电脑上现在的、副本现在的、上次同步时记下的——算出模型改了什么，再按权限档位写回用户的电脑：
//   只读 不写回；每次问我 全部等用户点头；自动审查 普通改动直接写回、有风险的问用户；全部允许 都写回，只有两边都改过的问用户。
// 读写用户电脑上的文件全靠桌面端给的 window.relayDesktop.folders（出不了用户选的文件夹，写之前备份，删除进回收站）。
// 浏览器和手机上没有这个接口：只显示「这个对话关联了电脑上的文件夹」，改动留着等用户回到桌面端再写回。
// 授权后整个文件夹传过来（超过 5000 个文件或 5GB 的退回按需：只传清单，用到哪个取哪个）。传的时候有进度条：文件夹条上、
// 等着发的回复上、项目页那一栏，顶栏还有一个不管哪个对话在传都看得见的小指示。每个文件夹一条队，切到别的对话传输照常继续
// 桌面端不分账号（同一台电脑上谁登录，看到的都是同一份授权列表），账号的区分全靠同步记录里的 st.user：授权一建立就记下，
// 只有那个账号登录时才显示、同步、接着传（见 lfReload、lfHold）
const LF = { api: (typeof window !== 'undefined' && window.relayDesktop?.folders) || null, links: [] /* 现在登录的账号的授权 */, strays: [] /* 没记账号、又认不出是这个账号的老授权 */,
  state: new Map(), pending: new Map(), status: new Map(), scope: null /* 上次画界面时的授权范围，换了对话才同步 */,

// ---- 同步记录 ----

    if (epoch !== authState.epoch) return; // 读的时候换了账号：这一份不算数，新账号的 lfWake 会再读一遍
    if (user && st.user === user) mine.push(l);
    else if (user && !st.user && lfScopeHere(l.scope)) { st.user = user; mine.push(l); await lfSaveState(l, st).catch(() => {}); }
    else if (!st.user) strays.push(l);
  }
  if (epoch !== authState.epoch) return;
  LF.links = mine; LF.strays = strays;
}
// 退出登录、换账号时（resetAccount 里调）：上一个账号的授权、记录、进度、等着发的回复一律不留在这一页上，顶栏的指示也收起；
// 登录后由 lfWake 按新账号重新读。还在路上的同步自己会停下（见 lfHold）。每个文件夹的队留着：换回来的要是同一个人，
// 接着传的事排在旧的后面，不会两边一起传
function lfForget() {
  LF.woke = ''; LF.links = []; LF.strays = []; LF.scope = null; LF.reviewDraw = null;
  LF.state.clear(); LF.pending.clear(); LF.status.clear(); LF.waits.clear();
  for (const t of Object.values(LF.timers)) clearTimeout(t);
  LF.timers = {};
  lfPaint();
}

// ---- 服务器上的副本 ----
const lfUrl = (link, rel) => '/api/linked?id=' + link.id + (rel ? '&path=' + encodeURIComponent(rel) : '');
async function lfServerList(link) { const r = await api(lfUrl(link)); return { map: new Map((r.files || []).map((f) => [f.path, f])), truncated: !!r.truncated }; }
async function lfFetchBytes(link, rel) {
  const r = await fetch('/api/file?path=' + encodeURIComponent('linked/' + link.id + '/' + rel) + '&download=1', { credentials: 'same-origin' });
  if (!r.ok) throw new Error('取不到 ' + rel);
  return new Uint8Array(await r.arrayBuffer());
}
// 大文件一段一段从用户电脑上读、一段一段发，不把整个文件放进内存（要新版桌面端；旧版走下面整份读的老路）。
// 发的还是附件上传那套分块接口，断了从断的地方接着发；传到一半用户又改了这个文件就停，下次重来。
// hold：每次发请求之前核对还是不是这条授权的账号（见 lfHold），换了账号就停，不重试
async function lfSendBig(link, rel, onProgress, hold = () => {}) {
  const first = await LF.api.stat(link.id, rel);
  if (!first) throw new Error('「' + rel + '」不见了');
  hold(); const { id } = await post('/api/upload-start', { linked: { id: link.id, path: rel }, name: 'file', size: first.size });
  let received = 0, fails = 0;
  for (;;) {
    if (LF.dropped?.has(link.id)) throw new Error('这个文件夹已经不用了'); // 传到一半用户收回了授权：不再往下传
    const part = await LF.api.readChunk(link.id, rel, received, CHUNK);
    if (part.size !== first.size || part.mtime !== first.mtime) throw new Error('「' + rel + '」传到一半被改动了，下次同步再传');
    let r, d;
    try { hold(); r = await fetch(`/api/upload-part?id=${id}&offset=${received}`, { method: 'PUT', body: part.bytes, credentials: 'same-origin' }); d = await r.json().catch((e) => { if (e?.staleAccount) throw e; return {}; }); }
    catch (e) {
      if (e?.staleAccount) throw e;
      if (++fails > 5) throw new Error('网络断了，没传完');
      await new Promise((ok) => setTimeout(ok, 2000));
      try { hold(); received = (await api('/api/upload-part?id=' + id)).received; } catch (e2) { if (e2?.staleAccount) throw e2; }
      continue;
    }
    if (r.status === 409) { received = d.received; continue; }
    if (!r.ok) throw new Error(d.error || '上传失败');
    received = d.received; fails = 0;
    if (onProgress) onProgress(first.size ? received / first.size : 1);
    if (d.done) return { ...d, local: first };
  }
}
// 大文件写回：从服务器一段一段取、一段一段交给桌面端写（桌面端收齐、核对过才换进用户的文件夹）
async function lfWriteBig(link, c, batch, expect, onProgress) {
  const start = await LF.api.writeStart(link.id, c.path, { batch, expect, size: c.server.size });
  if (start.conflict) return start;
  try {
    const r = await fetch('/api/file?path=' + encodeURIComponent('linked/' + link.id + '/' + c.path) + '&download=1', { credentials: 'same-origin' });
    if (!r.ok || !r.body) throw new Error('取不到 ' + c.path);
    const reader = r.body.getReader(); let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      for (let i = 0; i < value.length; i += CHUNK) await LF.api.writeChunk(start.token, value.subarray(i, i + CHUNK));
      got += value.length; if (onProgress && c.server.size) onProgress(Math.min(1, got / c.server.size));
    }
    return await LF.api.writeEnd(start.token);
  } catch (e) { await LF.api.writeAbort(start.token).catch(() => {}); throw e; }
}
// 把用户这边的改动传到副本（一个文件夹三个一起传；所有文件夹合起来同时最多 LF_UPLOADS 个，见 lfSlot）。个别文件读不出来（正被占用、刚被删）不算失败，下次再传。
// 大文件切成 4MB 一块发（和附件上传同一套，断了从断的地方接着发）：一次性发几十 MB，慢的线路上传到一半会被掐断。
// 传完一个记一个，并且至少每 3 秒（或每 25 个文件）存一次盘：中途刷新、关掉，已经传好的下次不用重传。
// 进度按字节算，同时给出文件数（progress）；大文件按分块往前走。base：这一批之前已经传好的（第一次整传接着传时，进度从那里算起）
// 换了账号（见 lfHold）：不再开始新的文件，每个请求发出之前也再核对一次；已经传好的照样记下（那是传进这条授权自己账号的）
async function lfPush(link, st, ups, base = null) {
  const epoch = authState.epoch, hold = () => lfHold(st, epoch);
  const puts = ups.filter((u) => u.kind === 'put'), removes = ups.filter((u) => u.kind === 'remove').map((u) => u.path);
  const sent = new Map(), live = new Map(); let n = 0, next = 0, missed = 0, failure = null, removed = false;
  const total = (base?.done || 0) + puts.length, totalBytes = (base?.bytes || 0) + puts.reduce((s, u) => s + (u.local?.size || 0), 0);
  let doneBytes = base?.bytes || 0, saved = Date.now(), unsaved = 0;
  const show = () => {
    const big = [...live.values()].filter((x) => x.size > CHUNK).map((x) => (x.size ? x.sent / x.size : 1));
    lfStatus(link, { phase: 'sync', text: '正在上传 ' + Math.min(n + 1, puts.length) + '/' + puts.length + (big.length ? '（大文件 ' + Math.round(100 * Math.min(...big)) + '%）' : ''),
      progress: { kind: 'upload', done: (base?.done || 0) + n, total, bytes: doneBytes + [...live.values()].reduce((s, x) => s + x.sent, 0), totalBytes } });
  };
  // 传好一个：记下（服务器回了大小和时间才记得下），隔一阵存一次盘
  const keep = async (rel, mine, r) => {
    if (r && r.mtime) st.files[rel] = [mine.size, mine.mtime, r.size, r.mtime]; else sent.set(rel, mine); // 旧服务器不回时间：批末再问一次列表
    live.delete(rel); n++; doneBytes += mine.size || 0;
    if (++unsaved >= 25 || Date.now() - saved >= 3000) { unsaved = 0; saved = Date.now(); await lfSaveState(link, st).catch(() => {}); }
  };
  const worker = async () => {
    while (next < puts.length && !failure) {
      const u = puts[next++], back = await lfSlot(); let f;
      try {
        if (LF.dropped?.has(link.id)) failure = failure || new Error('这个文件夹已经不用了');
        if (!failure && !lfHeld(st, epoch)) failure = staleAccount(); // 换了账号：不再开始新的文件
        if (failure) continue;
        live.set(u.path, { sent: 0, size: u.local?.size || 0 });
        if (u.local && u.local.size > CHUNK && LF.api.readChunk) { // 新版桌面端：分段读、分段发
          try {
            show();
            const r = await lfSendBig(link, u.path, (p) => { live.set(u.path, { sent: Math.round(p * u.local.size), size: u.local.size }); show(); }, hold);
            await keep(u.path, r.local, r);
          } catch (e) { failure = failure || e; }
          continue;
        }
        try { f = await LF.api.read(link.id, u.path); } catch { missed++; n++; doneBytes += u.local?.size || 0; continue; }
        try {
          live.set(u.path, { sent: 0, size: f.size });
          if (f.bytes.length > CHUNK) {
            show();
            hold(); // 读文件那一下（await）期间可能换了账号：发之前再核对
            const r = await sendInChunks(new Blob([f.bytes]), { linked: { id: link.id, path: u.path } }, (p) => { live.set(u.path, { sent: Math.round(p * f.size), size: f.size }); show(); });
            await keep(u.path, f, r); // 服务器回了大小和时间：这个文件现在就算同步好了
          } else { hold(); await keep(u.path, f, await api(lfUrl(link, u.path), { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: f.bytes })); }
        } catch (e) { failure = failure || e; }
      } finally { live.delete(u.path); back(); if (!failure) show(); }
    }
  };
  try {
    if (puts.length) show();
    // 一个文件夹自己最多同时传 3 个（全局最多 4 个）：一个大文件夹在传时，总留一个名额给别的文件夹，用户在别的对话发消息不用等它
    await Promise.all(Array.from({ length: LF_UPLOADS - 1 }, worker));
    if (failure) throw failure;
    for (let i = 0; i < removes.length; i += 500) { hold(); await post('/api/linked/remove', { id: link.id, paths: removes.slice(i, i + 500) }); }
    removed = true;
  } finally {
    // 不管成没成：已经传上去的记下来（服务器没回时间的——旧服务器——要问一下它们现在的大小和时间；换了账号就不问了，问到的会是别人的）
    try {
      if (lfHeld(st, epoch) && [...sent.keys()].some((rel) => !st.files[rel] || st.files[rel][0] !== sent.get(rel).size || st.files[rel][1] !== sent.get(rel).mtime)) {
        const sv = await lfServerList(link);
        for (const [rel, f] of sent) { const x = sv.map.get(rel); if (x) st.files[rel] = [f.size, f.mtime, x.size, x.mtime]; }
      }
      if (removed) for (const rel of removes) delete st.files[rel];
      if (n || sent.size || removed) await lfSaveState(link, st);
    } catch {}
  }
  return missed;
}

// 按需的文件夹放在副本里的那份清单：还没取来的文件各一行，模型照着它来要
const LF_INDEX = '_还没取来的文件清单.md';
function lfIndexText(link, all, st) {
  const rest = [...all.values()].filter((f) => !st.files[f.path] && !lfWants(st.want || [], f.path));
  return '# 「' + link.name + '」里还没取来的文件\n\n这个文件夹在用户的电脑上，用户已经信任它。为了不白传，下面这些文件还没有取到这里（这个目录里现在只有已经取来的）。\n' +
    '需要读或改哪一个，就在回答的最后单独写一行 <<需要文件：linked/' + link.id + '/相对路径>>（可以连写几行，一行一个；要整个子文件夹就写到那个子文件夹为止），然后停下；文件取来后你会收到通知再继续。之后你和用户谁改了这些文件，两边都会同步。\n' +
    '只是要在这个文件夹里新建文件的话不用取，直接在这个目录里建。不要改动、也不要删除这份清单。\n\n' +
    (rest.length ? rest.slice(0, 3000).map((f) => '- ' + f.path + '（' + (fmtSize(f.size) || '0 B') + '）').join('\n') + (rest.length > 3000 ? '\n- ……还有 ' + (rest.length - 3000) + ' 个没有列出' : '') : '（都已经取来了）') + '\n';
}
// 模型在回答末尾要了文件（服务器取出来放在 fileRequests 上）：文件夹已经信任过，不用再问用户，直接取来、同步完让它接着做
async function lfFetchRequested(convId) {
  const msg = S.conv?.id === convId ? S.conv.messages[S.conv.messages.length - 1] : null;
  if (!LF.api || !msg || msg.role !== 'assistant' || msg.filesFetched || !(msg.fileRequests || []).length) return;
  const mine = lfCurrentAll(), touched = new Map(), fresh = [];
  for (const one of msg.fileRequests) {
    const m = /^linked\/([a-f0-9]{16})\/(.+)$/.exec(String(one).replace(/\\/g, '/').replace(/^\.\//, '')), link = m && mine.find((l) => l.id === m[1]);
    if (!link) continue;
    const st = await lfLoadState(link);
    if (!st.lazy || st.files[m[2]] || lfWants(st.want || [], m[2])) continue;
    st.want = [...(st.want || []), m[2]]; touched.set(link.id, link); fresh.push({ link, rel: m[2] });
  }
  if (!fresh.length) return;
  msg.filesFetched = true;
  for (const link of touched.values()) { await lfSaveState(link); await lfRun(link).catch(() => {}); }
  const got = [], lost = [];
  for (const { link, rel } of fresh) { const have = Object.keys((await lfLoadState(link)).files); (have.some((k) => lfWants([rel], k)) ? got : lost).push(rel); }
  if (S.conv?.id !== convId || S.running.has(convId)) return;
  send({ text: (got.length ? '你要的文件取来了：' + got.join('、') + '。' : '') + (lost.length ? '这些在我电脑上没找到：' + lost.join('、') + '。' : '') + '请接着做。', attachments: [] });
}
// 按需的老授权、文件夹其实没超上限（st.fits）：用户在面板里点了「整个传过来」才升级成整个同步（见 lfWhole），不自动升级——
// 用户当初同意的是「用到哪个取哪个」。清掉按需的记号，把副本里那份清单删掉——清单从来不算文件夹里的文件（比对时总是先把它拿掉），
// 删了也不会被当成「模型删了文件」；接下来照整个同步走，没取过的这一次全传上去。
// 记成 st.filling（整个传一遍、还没传完）而不是 st.initial：这份副本模型早就在用了，副本里冒出来的东西照平常的规则处理（见 lfSync）
async function lfToWhole(link, st) {
  lfHold(st, authState.epoch);
  await post('/api/linked/remove', { id: link.id, paths: [LF_INDEX] });
  delete st.lazy; delete st.want; delete st.indexSig; delete st.fits;
  st.filling = true;
  await lfSaveState(link, st);
}
// 用户点了「整个传过来」：改成整个同步，接着整个传一遍（进度条照常，中途关掉了下次打开应用接着传），之后两边互相同步
function lfWhole(link) {
  return lfRun(link, {}, async () => {
    const st = await lfLoadState(link);
    if (!st.lazy) return;
    await lfToWhole(link, st);
    await lfSync(link);
    if (!LF.state.get(link.id)?.lazy && (LF.status.get(link.id) || {}).phase !== 'error') toast('「' + link.name + '」整个传过来了，之后两边互相同步');
  });
}
// 整个同步的文件夹后来涨过了上限（超过 5000 个文件或 5GB）：不报错卡住，转成按需——已经传过的照旧双向同步，
// 多出来的只进清单，Claude 用到哪个取哪个。告诉用户一声；文件夹条上这个文件夹旁边也一直写着
function lfToLazy(link, st) {
  st.lazy = true; st.want = st.want || []; st.fits = false;
  toast('「' + link.name + '」里的文件超过了 5000 个或 5GB，改成只传清单，Claude 用到哪个再取哪个');
}
// 按需的文件夹旁边那句话。fits：上次扫的时候没超上限（false 是超了；没有这一项是还没扫过）。
// 超了上限的说「文件太多」；没超的是以前按「用到哪个取哪个」授权的老授权，只说只传了清单，并提示可以整个传过来
const lfLazyNote = (st) => (st.fits === false ? '文件太多，只传了清单，Claude 用到哪个取哪个' : st.fits ? '只传了清单，点名字可以整个传过来' : '只传了清单，Claude 用到哪个取哪个');
// 项目的文件夹第一次整传传完了：这时才记到项目信息上（st.unlisted 是还没记），这个项目在别的设备上的对话从此也知道它；
// 在那之前服务器不会告诉模型这个文件夹，模型也就不会往还没传完的副本里写东西。记不上（比如断网）留着记号，下次同步完再记
async function lfListInProject(link, st) {
  const p = lfOwned(st) && (S.projects || []).find((x) => 'p:' + x.id === link.scope);
  if (!p) return;
  const list = lfInfos(p.linked);
  try {
    if (!list.some((x) => x.id === link.id)) await lfSaveProjectLinked(p.id, [...list, { id: link.id, name: link.name }].slice(0, 6));
    delete st.unlisted; await lfSaveState(link, st);
  } catch (e) { if (e?.staleAccount) throw e; }
}
// ---- 同步：先传用户这边的改动，再看模型改了什么 ----
// quick：发消息前用。用户这边一个文件都没动过就什么都不做（不问服务器），发消息不会被拖慢。
// 不是 quick 的（打开、切到这个对话时那一次）先在文件夹条上显示「正在核对文件…」，没有变化很快就消失。
// 别的对话（另一条授权）写回到用户电脑上的改动，在这里看来就是「用户这边变了」，照常传进这个对话的副本
async function lfSync(ref, { quick = false } = {}) {
  const link = LF.links.find((l) => l.id === ref.id); if (!link) return;
  const st = await lfLoadState(link), epoch = authState.epoch;
  // 这条授权不是现在这个账号的，或者同步途中换了账号：停下，一个文件都不往服务器上传。每次和服务器打交道之前都核对（见 lfHold）
  const hold = () => lfHold(st, epoch);
  hold();
  const checking = () => lfStatus(link, { phase: 'sync', text: '正在核对文件…', progress: { kind: 'scan', done: 0, total: 0, bytes: 0, totalBytes: 0 } });
  if (!quick) checking();
  // 先按「整个同步」的上限扫一遍：超了就按需，再要一份不受上限限制的完整清单。
  // 按需的老授权、文件夹其实没超上限的：不自动改成整个同步（用户当初同意的是「用到哪个取哪个」），只记下 st.fits，
  // 面板里给用户一个「整个传过来」的按钮（见 lfWhole）
  let local = await LF.api.scan(link.id);
  if (local.tooMany) {
    if (!st.lazy) lfToLazy(link, st);
    st.fits = false;
    local = await LF.api.scan(link.id, { all: true });
    if (local.tooMany) throw new Error('「' + link.name + '」里的文件太多了，没法同步');
  } else if (st.lazy) st.fits = true;
  const all = new Map(local.files.filter((f) => f.path !== LF_INDEX).map((f) => [f.path, f]));
  // 按需的文件夹（st.lazy，超过上限的那种）：整个文件夹都认，但只传模型要过的（st.want）和已经取来的文件，
  // 其余的只把名字写进一份清单放在副本里，模型要读哪个再说（见 lfFetchRequested）
  const want = st.lazy ? st.want || [] : [], tracked = (k) => !st.lazy || !!st.files[k] || lfWants(want, k);
  let L = st.lazy ? new Map([...all].filter(([k]) => tracked(k))) : all;
  const indexText = st.lazy ? lfIndexText(link, all, st) : '', indexSig = st.lazy ? indexText.length + ':' + [...indexText].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7) : '';
  if (quick && indexSig === (st.indexSig || '') && !Object.keys(st.files).some((k) => !L.has(k)) && ![...L].some(([k, f]) => !st.files[k] || st.files[k][0] !== f.size || st.files[k][1] !== f.mtime)) return;
  if (quick) checking();
  hold(); const sv = await lfServerList(link);
  sv.map.delete(LF_INDEX); // 清单是给模型看的，不算文件夹里的文件
  // 副本整个不见了（那边被清过）：全部重传。绝不当成「模型把文件全删了」。这份副本早就给模型用过（项目信息、对话里都记着它，
  // 别的设备上的对话可能正在用），所以记成 st.filling（整个重传一遍、还没传完），不是 st.initial（从没传完过第一次）——见下面
  if (!sv.map.size && Object.keys(st.files).length) { st.files = {}; if (!st.initial) st.filling = true; }
  if (st.lazy) L = new Map([...all].filter(([k]) => tracked(k) || sv.map.has(k))); // 模型新建的文件和用户这边没取过的文件重名：拿来比，不能直接盖
  if (st.lazy && indexSig !== (st.indexSig || '')) { hold(); await api(lfUrl(link, LF_INDEX), { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: new TextEncoder().encode(indexText) }); st.indexSig = indexSig; }
  const cmp = lfCompare(st.files, L, sv.map), found = [];
  for (const rel of cmp.forget) delete st.files[rel];
  // 第一次整传还没传完（st.initial：中途刷新、关掉了）：两边都有、大小一样、没有记录的（上次传上去了、还没来得及记），
  // 直接补记录（拿服务器列表里的大小和时间），不下载回来比——只有这一种走捷径。
  // 其余的照平常的规则：副本里多出来、用户这边没有的，当成「模型新建的」（等用户确认或按档位写回），不删；两边都有、大小不同的，
  // 当成「两边都改过」等用户选，不拿用户的直接盖。照理传完之前模型碰不到这份副本（发消息要等传完；项目的文件夹传完才记到项目信息上，
  // 别的设备上这个项目的对话在那之前不知道它），这是兜底：万一碰了，模型的东西不会被悄悄删掉、盖掉。
  // st.filling（副本早就给模型用过，现在整个重传或从按需改成整个同步）连这个捷径也不走，照平常的规则下载回来比
  if (st.initial) cmp.both = cmp.both.filter((c) => {
    if (st.files[c.path] || !c.local || !c.server || c.local.size !== c.server.size) return true;
    st.files[c.path] = [c.local.size, c.local.mtime, c.server.size, c.server.mtime]; return false;
  });
  let base = null;
  if (st.initial || st.filling) { // 进度从已经传好的那里算起：看得出是接着传，不是从头来
    base = { done: 0, bytes: 0 };
    const again = new Set(cmp.up.map((u) => u.path));
    for (const [k, f] of L) if (!again.has(k) && st.files[k] && st.files[k][0] === f.size && st.files[k][1] === f.mtime) { base.done++; base.bytes += f.size; }
  }
  // 副本变了但内容其实一样（重写了一遍、或两边改成了一样）：记下就行，不打扰用户
  const same = async (c) => {
    if (!c.local || !c.server || c.local.size !== c.server.size) return false;
    if (c.local.size > LF_BIG) { // 大文件不搬内容：桌面端算指纹，和版本历史里现在这一版的指纹对
      if (!LF.api.hash) return false;
      try {
        const mine = await LF.api.hash(link.id, c.path);
        hold(); const now = (await api('/api/linked/history?id=' + link.id + '&path=' + encodeURIComponent(c.path))).versions.find((x) => x.current);
        if (!now || now.deleted || now.sha !== mine.sha) return false;
        st.files[c.path] = [mine.size, mine.mtime, c.server.size, c.server.mtime]; return true;
      } catch (e) { if (e?.staleAccount) throw e; return false; }
    }
    try { const mine = await LF.api.read(link.id, c.path); hold(); const theirs = await lfFetchBytes(link, c.path); if (!lfSameBytes(mine.bytes, theirs)) return false; st.files[c.path] = [mine.size, mine.mtime, c.server.size, c.server.mtime]; return true; }
    catch (e) { if (e?.staleAccount) throw e; return false; }
  };
  for (const c of cmp.down) { if (sv.truncated && c.kind === 'deleted') continue; if (!(await same(c))) found.push(c); }
  for (const b of cmp.both) if (!(await same(b))) found.push({ path: b.path, kind: !b.server ? 'deleted' : b.local ? 'modified' : 'created', local: b.local, server: b.server, conflict: true });
  const missed = cmp.up.length ? await lfPush(link, st, cmp.up, base) : 0;
  hold(); // 传的时候换了账号：不收尾，记录照旧是「还没传完」，换回这个账号时接着传
  delete st.initial; delete st.filling; // 走到这里整个传一遍就算传完了（个别读不出来的文件下次照常再传）
  st.at = Date.now(); await lfSaveState(link, st); // 不在这里记账号：账号是授权时记的（见 lfAdopt），同步只认、不改
  if (st.unlisted) await lfListInProject(link, st); // 项目的文件夹：第一次整传传完了，这时才记到项目信息上
  const before = lfWaiting(link).length;
  LF.pending.set(link.id, found.sort((a, b) => (a.path < b.path ? -1 : 1)));
  lfAutoList(link).forEach((c) => { c.applying = true; }); // 马上要自动写回的：界面上算「正在写回」，不算「等你确认」
  lfStatus(link, { phase: missed ? 'error' : 'idle', text: missed ? '有 ' + missed + ' 个文件没传上去（可能正被别的程序占用）' : '', skipped: local.skippedCount, progress: null });
  await lfSettle(link);
  const left = lfWaiting(link).length;
