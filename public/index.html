}
// 按权限档位自动写回能写回的那些
// 这个文件夹里按现在的档位可以自动写回的改动；真正在等用户点头的改动（不含正在写回的）
function lfAutoList(ref) {
  const link = LF.links.find((l) => l.id === ref.id), pend = (link && LF.pending.get(link.id)) || [];
  return link && (link.tier === 'auto' || link.tier === 'all') ? pend.filter((c) => !c.failed && !lfReasons(link.tier, c, pend).length) : [];
}
const lfWaiting = (link) => (LF.pending.get(link.id) || []).filter((c) => !c.applying);
async function lfSettle(ref) {
  const link = LF.links.find((l) => l.id === ref.id), auto = link ? lfAutoList(link) : [];
  if (!auto.length) return;
  const r = await lfApply(link, auto);
  if (r.done.length) toast('已把 ' + r.done.length + ' 个文件写回「' + link.name + '」');
}
// 把这些改动写回用户的电脑。expect 带着比对时用户这边文件的样子：这中间用户又改过，桌面端不覆盖，留给下一次比对
async function lfApply(link, changes) {
  const st = await lfLoadState(link), epoch = authState.epoch, done = [], failed = []; let batch = (LF.status.get(link.id) || {}).openBatch;
  changes.forEach((c) => { c.applying = true; delete c.failed; });
  // 进度和上传一样按字节算（删除不占字节，只算个数）；大文件按分段往前走
  const size = (c) => (c.kind === 'deleted' ? 0 : c.server?.size || 0), totalBytes = changes.reduce((s, c) => s + size(c), 0);
  let doneBytes = 0, cur = null;
  const report = (part) => lfStatus(link, { phase: 'sync', text: '正在写回 ' + Math.min(done.length + failed.length + 1, changes.length) + '/' + changes.length + (part == null ? '' : '（大文件 ' + Math.round(part * 100) + '%）'),
    progress: { kind: 'writeback', done: done.length + failed.length, total: changes.length, bytes: doneBytes + (part == null || !cur ? 0 : Math.round(part * size(cur))), totalBytes } });
  for (const c of changes) {
    lfHold(st, epoch); // 换了账号：不再往用户电脑上写（这时取到的会是另一个账号的副本）
    cur = c; report();
    try {
      const expect = c.local ? { size: c.local.size, mtime: c.local.mtime } : null; let r;
      if (c.kind === 'deleted') { r = await LF.api.trash(link.id, c.path, { batch, expect }); if (!r.conflict) delete st.files[c.path]; }
      else {
        r = c.server.size > LF_BIG && LF.api.writeStart ? await lfWriteBig(link, c, batch, expect, report) : await LF.api.write(link.id, c.path, await lfFetchBytes(link, c.path), { batch, expect });
        if (!r.conflict) st.files[c.path] = [r.size, r.mtime, c.server.size, c.server.mtime];
      }
      if (r.conflict) { failed.push({ path: c.path, why: '你刚刚也改了这个文件' }); c.applying = false; c.failed = '你刚刚也改了这个文件'; continue; }
      batch = r.batch || batch; done.push(c);
      LF.pending.set(link.id, (LF.pending.get(link.id) || []).filter((x) => x !== c)); // 写完一个就从列表里去掉一个
    } catch (e) { failed.push({ path: c.path, why: e.message }); c.applying = false; c.failed = e.message || '没写回成功'; }
    finally { doneBytes += size(c); cur = null; }
  }
  await lfSaveState(link, st);
  LF.pending.set(link.id, (LF.pending.get(link.id) || []).filter((c) => !done.includes(c)));
  lfStatus(link, { phase: 'idle', text: '', progress: null });
  const old = LF.status.get(link.id) || {};
  if (done.length) lfStatus(link, { batch, openBatch: batch, wrote: (old.openBatch === batch ? old.wrote || 0 : 0) + done.length }); else lfRender();
  if (failed.length) toast(failed[0].why + (failed.length > 1 ? '（还有 ' + (failed.length - 1) + ' 个也没写回）' : ''));
  return { done, failed, batch };
}
// 不要这些改动：把用户这边的版本放回副本（模型新建的就从副本里删掉），模型下次看到的是用户的版本
async function lfDecline(link, changes) {
  const st = await lfLoadState(link);
  await lfPush(link, st, changes.map((c) => ({ path: c.path, kind: c.local ? 'put' : 'remove', local: c.local })));
  for (const c of changes) if (!c.local) delete st.files[c.path];
  await lfSaveState(link, st);
  LF.pending.set(link.id, (LF.pending.get(link.id) || []).filter((c) => !changes.includes(c)));
  lfStatus(link, { phase: 'idle', text: '', progress: null });
}
// 每个文件夹一条队：同一个文件夹的同步、写回、撤销一件一件来，不会互相踩；不同文件夹互不等待——对话甲的大文件夹在传，
// 对话乙发消息不会被堵住（同一个项目的两个对话用的是同一个文件夹，那就该等：文件得先到）。
// 这个文件夹已经有一次同步排着、还没开始，再要同步就搭它的车，不重复排（来回切对话不会排上一长串）；
// 整个同步顶得上发消息前的快速同步，反过来不行。排着的是写回、撤销这类别的事时，之后要的同步照常另排在它后面。
// strict：失败时把原因抛给调用的地方（发消息前用）
function lfRun(link, opts = {}, work = null) {
  let q = LF.queues.get(link.id);
  if (!q) LF.queues.set(link.id, (q = { tail: Promise.resolve(), next: null }));
  let job;
  if (!work && q.next && (opts.quick || !q.next.quick)) job = q.next.job;
  else {
    const entry = { quick: !!opts.quick, job: null };
    job = entry.job = q.tail.then(() => { if (q.next === entry) q.next = null; return work ? work() : lfSync(link, opts); });
    q.next = work ? null : entry;
    q.tail = job.catch(() => {});
  }
  return job.catch((e) => {
    if (e?.staleAccount) { LF.status.delete(link.id); lfRenderSoon(); throw e; } // 换了账号停下的：不算出错，进度条也收起
    lfStatus(link, { phase: 'error', text: e.message || '同步没成功', progress: null });
    if (opts.strict) throw new Error('同步「' + link.name + '」没成功：' + (e.message || '') + '。可以点输入框下面的文件夹按钮，让这个对话先不用它');
  });
}
// 等这个文件夹队里现在排着的事都做完（不管成没成）
const lfIdle = (link) => (LF.queues.get(link.id)?.tail || Promise.resolve());
// 上传名额：所有文件夹合起来同时最多传 LF_UPLOADS 个文件。拿到名额返回一个「还回去」的函数
function lfSlot() {
  return new Promise((ok) => {
    const take = () => { LF.busy++; let back = false; ok(() => { if (back) return; back = true; LF.busy--; const next = LF.slotWait.shift(); if (next) next(); }); };
    if (LF.busy < LF_UPLOADS) take(); else LF.slotWait.push(take);
  });
}
async function lfUndo(link) {
  const st = LF.status.get(link.id) || {}; if (!st.batch) return;
  await lfRun(link, {}, async () => {
    const r = await LF.api.undo(link.id, st.batch);
    lfStatus(link, { batch: null, openBatch: null, wrote: 0 });
    await lfSync(link); // 还原后的文件再传回副本，两边重新一致
    toast(r.skipped.length ? '已撤销 ' + r.restored.length + ' 个；有 ' + r.skipped.length + ' 个之后你又改过，没有动' : '已撤销，' + r.restored.length + ' 个文件恢复原样');
  });
}

// ---- 和发消息、回复结束接上 ----
// 发消息前：带上关联的文件夹（服务器据此告诉模型副本在哪），并把用户这边的改动先传上去
async function lfBeforeSend(body, convId) {
  // 聊天的对话碰不到用户电脑上的文件：不带文件夹、不让模型请求访问、也不同步。新对话里先选了工作、授权了文件夹又切回聊天发出去的，
  // 那些授权这时收回（草稿的编号就是这个新对话的编号），不留下没人用的副本；项目里的不收（文件夹归项目，别的对话还要用）
  if ((body.mode || chatModeOfConv(convId)) === 'chat') {
    if (LF.api && body.newId && !body.projectId && lfScoped(body.newId).length) lfDropScope(body.newId).catch(() => {});
    return;
  }
  if (LF.api?.trust) body.canTrust = true; // 告诉服务器：这边能按请求授权用户电脑上别的位置（见 lfGrant）
  const links = lfCurrentAll(); if (!links.length) return;
  body.linked = links.map((l) => ({ id: l.id, name: l.name, ...(LF.state.get(l.id)?.lazy ? { lazy: true } : {}) })); // lazy：按需取文件的文件夹，服务器会告诉模型去看清单
  const asked = S.conv?.id === convId && S.conv.messages.findLast((m) => m.role === 'user'); // 页面里刚放进去的这条提问也标上，和服务器存的一致
  if (asked) asked.linked = body.linked;
  // 等同步的时候回复那里显示在等哪个文件夹、传到哪了（见 lfWaitText）。按消息记：用户在这个对话等着时又去别的对话发，两边各显示各的
  const index = S.conv?.id === convId ? S.conv.messages.length - 1 : -1, reply = index >= 0 ? S.conv.messages[index] : null;
  const wait = reply?.role === 'assistant' ? { index, id: null } : null;
  if (wait) LF.waits.set(reply, wait);
  try {
    for (const link of links) {
      if (link.missing) throw new Error('找不到文件夹「' + link.name + '」，它可能被移走或改名了。可以点输入框上面它的名字，先不用它');
      const st = LF.status.get(link.id) || {};
      if (st.openBatch) lfStatus(link, { openBatch: null, wrote: 0, batch: st.batch }); // 新的一轮：上一轮的「已写回」提示收起来，之后的写回另算一批
      if (wait) wait.id = link.id;
      await lfRun(link, { quick: true, strict: true });
    }
    // 同步时文件夹可能刚从按需升级成整个同步（或反过来）：按现在的样子告诉服务器
    for (const x of body.linked) { if (LF.state.get(x.id)?.lazy) x.lazy = true; else delete x.lazy; }
  } finally {
    if (wait) { LF.waits.delete(reply); if (wait.shown && typeof rerenderMsg === 'function' && S.conv?.messages[wait.index] === reply) rerenderMsg(wait.index); }
  }
}
// 回复结束（或它改动的文件统计好了）：看看副本有没有被改。用着同一个文件夹的对话还有在回复的，等它们也结束
function lfAfterReply(convId) {
  if (!LF.api || chatModeOfConv(convId) === 'chat') return; // 聊天的对话不碰文件夹
  for (const id of lfIdsOfConv(convId)) {
    const link = LF.links.find((l) => l.id === id); if (!link) continue;
    clearTimeout(LF.timers[id]);
    LF.timers[id] = setTimeout(() => {
      if ([...S.running].some((c) => lfIdsOfConv(c).includes(id))) return;
      lfRun(link).catch(() => {}).then(() => lfFetchRequested(convId)).catch(() => {}); // 先看副本的改动，再看模型有没有要文件
    }, 1200);
  }
}
// 登录状态确定后调一次（每个账号一次）：读出关联的文件夹；用户不在的时候模型可能改过副本，各看一眼
async function lfWake() {
  if (!LF.api || !authState.user || LF.woke === authState.user) return;
  const epoch = authState.epoch;
  LF.woke = authState.user; LF.state.clear(); LF.pending.clear(); LF.status.clear(); LF.scope = null; LF.links = []; LF.strays = [];
  await lfReload();
  if (epoch !== authState.epoch) return; // 读的时候又换了账号：交给新账号的那一次
  // 对话、项目已经不在了（或是按对话分开之前留下的）而且放了一天以上的授权：收回。LF.links 里只有确属这个账号的（见 lfReload）——
  // 别的账号的、认不出是谁的老授权不在里面，不会因为「这个账号里没有它的对话」被当成不在了收回
  for (const l of LF.links.slice()) {
    const alive = lfScopeHere(l.scope);
    if (!alive && Date.now() - (l.addedAt || 0) > 86400000) await lfDrop(l).catch(() => {});
  }
  if (epoch !== authState.epoch) return;
  lfRender(); lfRedrawProject(); // 只同步当前这个对话的（见 lfRender）；别的对话打开时再同步它们自己的
  // 例外：整个传一遍上次没传完的（第一次整传、或整个重传；刷新、关掉了应用），不管是哪个对话的，接着传——已经传好、记下的不重传。
  // 只接着传这个账号自己的
  for (const l of LF.links) { const st = LF.state.get(l.id); if (lfOwned(st) && (st.initial || st.filling) && !l.missing) lfRun(l).catch(() => {}); }
}

// ---- 界面 ----
function lfRender() {
  const bar = $('#folderBar'), btn = $('#folderBtn'); if (!bar || !btn) return;
  renderChatMode(); // 顶栏的「聊天 / 工作」跟着一起画
  // 聊天的对话（或新对话里选了聊天）：选文件夹、权限、文件夹条都不显示，也不为它同步；切回工作（新对话里）时再同步

    if (pend) html += `<button class="fb-act" data-a="review"${at}>${link.tier === 'read' ? pend + ' 处改动（只读，没有写回）' : pend + ' 处改动等你确认'}</button>`;
    if (st.openBatch && st.wrote) html += `<span class="fb-note">已写回 ${st.wrote} 个文件</span><button class="fb-act quiet" data-a="undo"${at}>撤销</button>`;

  }

// 却打不了字；prompt() 在 Electron 里干脆不支持。确认框返回 true/false；带 input 时返回填写的文字，取消返回 null
function ask(title, { detail = '', ok = '确定', danger = false, input = null } = {}) {
  return new Promise((resolve) => {
    const field = !input ? '' : `<label class="form-field">${input.multiline
      ? `<textarea data-in maxlength="${input.maxlength || 300}"></textarea>` : `<input data-in maxlength="${input.maxlength || 80}">`}</label>`;
    const el = sheet(`<h3>${esc(title)}</h3>${detail ? `<p class="ask-detail">${esc(detail)}</p>` : ''}${field}` +
      `<div class="sheet-row"><button class="btn" data-no>取消</button><button class="btn ${danger ? 'danger' : 'dark'}" data-ok>${esc(ok)}</button></div>`);
    const inp = el.querySelector('[data-in]');
    if (inp) inp.value = input.value || '';
    const key = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); done(false); }
      else if (e.key === 'Enter' && !e.isComposing && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); done(true); }
    };
    const done = (yes) => {
      document.removeEventListener('keydown', key, true); el.remove();
      resolve(input ? (yes ? inp.value : null) : yes);
    };
    el.onclick = (e) => { if (e.target === el || e.target.closest('[data-no]')) done(false); else if (e.target.closest('[data-ok]')) done(true); };
    document.addEventListener('keydown', key, true);
    if (inp) { inp.focus(); inp.select(); } else el.querySelector('[data-ok]').focus();
  });
}

    if (!scenePrev) { fns[sceneNow](now, dt); return; }
    const m = ease(clamp01((now - sceneAt) / MIX)), main = ctx;
    try { [scenePrev, sceneNow].forEach((s, i) => { ctx = layer(i).getContext('2d'); fns[s](now, dt); }); }
    finally { ctx = main; }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1 - m; ctx.drawImage(layers[0], 0, 0); ctx.globalAlpha = m; ctx.drawImage(layers[1], 0, 0); ctx.globalAlpha = 1;
    if (m >= 1) scenePrev = null;
  }

  function loop(now) {
    const h = pickHost(), q = !!h && h.id === 'main' && !h.classList.contains('is-empty'); // q：在对话里，只画暗纹
    if (h !== host || q !== calm) {
      sceneNow = null; scenePrev = null; // 换了地方：整幅从头淡入，不用再叠一次换画
      host = h; calm = q;
      canvas.classList.remove('on'); canvas.classList.toggle('quiet', calm);
      if (host) {
        host.prepend(canvas); W = H = 0; blocks = []; seaY = null; // 重新放进去一次，淡入从头开始
        if (!calm) {
          if (!entered) { entered = true; shownAt = now; fly.mode = 'in'; fly.u = 0; }
          else { shownAt = now - 60000; fly.mode = 'perch'; fly.next = (now - t0) / 1000 + 8 + Math.random() * 14; }
        }
        requestAnimationFrame(() => canvas.classList.add('on'));
      }
    }
    // 没有地方显示（项目页）或页面在后台：不画，半秒看一次要不要恢复
    if (!host || document.hidden) { setTimeout(() => requestAnimationFrame(loop), 500); return; }
    const want = wantScene();
    if (sceneNow === null) sceneNow = want;
    else if (want !== sceneNow) { scenePrev = reduce ? null : sceneNow; sceneNow = want; sceneAt = now; lastFrame = 0; }
    const resized = fit();
    // 对话页的暗纹不动：尺寸变了马上重画，平时半秒看一眼（输入框变高、深浅色切换）就够了
    if (calm) {
      // Claude 的对话页有几片花在飘，要一帧一帧画（每秒约 20 帧）；别家的暗纹不动，半秒看一眼就够
      const live = !reduce && sceneNow === 'anthropic' && !scenePrev;
      if (resized || scenePrev || now - lastFrame >= (live ? 50 : 500)) { const dt = live ? Math.min(0.1, (now - lastFrame) / 1000) : 0; lastFrame = now; render(now, dt); }
      if (scenePrev || live) requestAnimationFrame(loop); else setTimeout(() => requestAnimationFrame(loop), 250);
      return;
    }
    measure(now);
    // 画布一改尺寸就被清空了，所以这一帧必须马上重画（不等 30 帧的节拍），否则拖窗口、转屏、收放侧边栏时会闪一下白
    if (resized || now - lastFrame >= 33) { const dt = Math.min(0.1, (now - lastFrame) / 1000); easeSea(dt); lastFrame = now; render(now, dt); }
    if (reduce) { setTimeout(() => requestAnimationFrame(loop), 1000); return; }
    requestAnimationFrame(loop);
  }
  // 新模型提示右边的画：同一支蜡笔画的黄昏和海，海平线是一道往上拱的弧线，太阳一半沉在海里。
  // 设计尺寸 400×440，按画框大小「铺满」裁切，海平线尽量落在画框中间偏下
  window.relayNewsArt = (target) => {
    const w = 400, h = 440, top = 262, R = 640, cx = w / 2;
    const arc = (x) => top + R - Math.sqrt(R * R - (x - cx) ** 2);
    // 在整幅宽度上撒点（不用 fill 的多边形判断，大面积涂色快得多）；keep 决定这一点留不留
    const wash = (g, r, y0, y1, o, keep) => {
      g.fillStyle = `rgb(${o.c})`;
      for (let k = (w + 16) * (y1 - y0) * o.d / 1.3; k > 0; k--) {
        const x = -8 + r() * (w + 16), y = y0 + r() * (y1 - y0);
        if (!keep(x, y)) continue;
        dot(g, r, x, y, o.a, 1 - o.p);
      }
      g.globalAlpha = 1;
    };
    const line = (dy, x0 = -10, x1 = w + 10, n = 22) => Array.from({ length: n }, (_, i) => { const x = x0 + i * (x1 - x0) / (n - 1); return [x, arc(x) + dy]; });
    const pic = sprite(w, h, 52, (g, r) => {
      // 天：上面一层很淡的粉，越往海平线越暖
      // 深色模式是黑板上的粉笔：天空涂得密一点，不然在深色纸上全是零散的亮点
      const dk = dark ? 1.9 : 1;
      wash(g, r, -8, top + 40, { c: C.pink, p: .3, d: .5 * dk, a: dark ? .22 : .32 }, (x, y) => y < arc(x) && r() < 0.25 + 0.75 * y / arc(x));
      wash(g, r, 60, top + 40, { c: C.sun, p: .58, d: 1.5 * dk, a: dark ? .42 : .5 }, (x, y) => y < arc(x) && r() < Math.pow((y - 60) / (arc(x) - 60), 2.6));
      // 太阳：一半沉在海里
      fill(g, r, ring(cx, arc(cx) - 4, 30, 18), { c: C.sun, p: .9, d: 2.4, a: .85, soft: 2, cut: (x, y) => y > arc(x) - 1 });
      // 海：越远越浅，近处深一点
      wash(g, r, top - 4, h + 8, { c: C.sea, p: .72, d: 1.7, a: .62 }, (x, y) => y > arc(x) + 1);
      wash(g, r, top + 40, h + 8, { c: C.blueDeep, p: .55, d: 1.1, a: .5 }, (x, y) => y > arc(x) + 50 && r() < Math.min(1, (y - arc(x) - 50) / 120));
      rub(g, r, line(1), { w: 3, p: .8, c: C.blueDeep, a: .8 });
      // 一道道浪
      for (let k = 0; k < 18; k++) {
        const dy = 12 + k * 10 + r() * 6, x0 = r() * w * .85 - 30, len = 60 + r() * 150;
        rub(g, r, line(dy, x0, x0 + len, 6).map(([x, y], i) => [x, y + Math.sin(i * 1.7 + k) * 1.4]),
          { w: 2.2 + r() * 2, p: .5, d: 1.2, a: .55, c: k % 3 ? C.wing : C.blue, press: soft });
      }
      // 太阳落在海面上的一道光
      for (let k = 0; k < 9; k++) {
        const y = arc(cx) + 9 + k * 13, half = 34 - k * 3 + r() * 6;
        rub(g, r, [[cx - half, y], [cx + half, y + (r() - .5) * 2]], { w: 3, p: .62, d: 1.3, a: .7 - k * .05, c: C.sun, press: soft });
      }
    });
    const cw = target.clientWidth, ch = target.clientHeight, s = Math.min(2, devicePixelRatio || 1);
    if (!cw || !ch) return;
    target.width = Math.round(cw * s); target.height = Math.round(ch * s);
    target.style.background = `rgb(${C.paper})`;
    const scale = Math.max(cw / w, ch / h), dw = w * scale, dh = h * scale;
    const dy = Math.min(0, Math.max(ch - dh, ch * 0.56 - top * scale));
    const g = target.getContext('2d'); g.setTransform(s, 0, 0, s, 0, 0); g.imageSmoothingQuality = 'high';
    g.drawImage(pic, 0, 0, Math.ceil(w * pic.s), Math.ceil(h * pic.s), (cw - dw) / 2, dy, dw, dh);
  };
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
  requestAnimationFrame(loop);
})();

renderAtts();
start();
</script>
</body>
</html>
